<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico — Corp Projects</title><link rel="stylesheet" href="/tool-theme.css">
<style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0c0e12;--bg2:#13161c;--bg3:#1a1e27;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.15);--text:#f0f2f7;--text2:#8b92a8;--text3:#5a6278;--green:#22c487;--red:#f05252;--blue:#4d9cf8;--amber:#f59e0b}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px}.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;gap:10px}.logo{width:32px;height:32px;background:linear-gradient(135deg,#4d9cf8,#22c487);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.hbtn{margin-left:auto;background:none;border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:6px 12px;font-size:13px;text-decoration:none}.wrap{max-width:820px;margin:0 auto;padding:16px}.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}.card h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--border);font-size:14px}.kv:first-of-type{border-top:none}.kv b{font-variant-numeric:tabular-nums}.ok{color:var(--green)}.mal{color:var(--red)}.reg{color:var(--amber)}
pre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12px;overflow:auto;white-space:pre-wrap}.btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}</style></head>
<body><script>try{if(localStorage.getItem("cp_theme")==="light")document.body.classList.add("light");}catch(e){}</script>
<div class="header"><div class="logo">CP</div><div><div style="font-weight:700">Diagnóstico</div><div style="font-size:12px;color:var(--text2)">WhatsApp y velocidad</div></div><a class="hbtn" href="/">← Dashboard</a></div>
<div class="wrap"><div id="wa"><div class="card">Comprobando WhatsApp…</div></div><div id="res"><div class="card">Midiendo…</div></div><button class="btn" onclick="medir()">Medir otra vez</button><div class="card" style="margin-top:12px"><h3>Datos en crudo (para pegar)</h3><pre id="raw"></pre></div></div>
<script>
const tok=localStorage.getItem('cp_token');
function ms(v,ok,mal){if(v==null)return '<span class="mal">—</span>';const c=v<=ok?'ok':v<=mal?'reg':'mal';return `<span class="${c}"><b>${v} ms</b></span>`;}
async function medir(){const el=document.getElementById('res');el.innerHTML='<div class="card">Midiendo…</div>';
  const t0=performance.now();let d;try{const r=await fetch('/api/diag/ping',{headers:{'Authorization':'Bearer '+tok}});d=await r.json();if(!r.ok)throw new Error(d.error||'HTTP '+r.status);}catch(e){el.innerHTML='<div class="card mal">❌ '+e.message+' — abre esta página desde el dashboard con tu sesión de Dueño.</div>';return;}
  const total=Math.round(performance.now()-t0);
  const t1=performance.now();await fetch('/config.js',{cache:'no-store'});const estatico=Math.round(performance.now()-t1);
  const m=d.mongo||{},s=d.stelorder||{};
  el.innerHTML=`<div class="card"><h3>Servidor (Railway)</h3><div class="kv"><span>Región</span><b>${d.servidor?.region||'no informada'}${/^(sfo|us-|iad|ord|dfw|lax)/.test(String(d.servidor?.region||''))?' <span class="mal">· Estados Unidos</span>':''}</b></div><div class="kv"><span>Encendido desde hace</span><b>${d.servidor?.uptimeMin??'—'} min</b></div><div class="kv"><span>Ida y vuelta a un archivo (tu red ↔ servidor)</span>${ms(estatico,300,700)}</div><div class="kv"><span>Esta medición completa</span>${ms(total,800,2000)}</div></div>
  <div class="card"><h3>Base de datos (MongoDB Atlas)</h3><div class="kv"><span>Host</span><b style="font-size:12px;word-break:break-all">${m.host||'—'}</b></div><div class="kv"><span>Ping servidor ↔ Mongo</span>${ms(m.pingMs,30,150)}</div><div class="kv"><span>Leer 5 usuarios (primera consulta)</span>${ms(m.findUsersMs,120,400)}</div><div class="kv"><span>La misma, ya caliente</span>${ms(m.segundaFindMs,60,200)}</div><div class="kv"><span>5 consultas a la vez</span>${ms(m.cincoEnParaleloMs,100,500)}</div>${m.pingMs>150?'<div style="font-size:13px;color:var(--amber);margin-top:8px;line-height:1.5">⚠️ El ping a Mongo es alto: Railway y Atlas están en regiones distintas. Cada consulta paga ese viaje. Solución: clúster de Atlas en la misma región que Railway.</div>':(m.pingMs!=null?'<div style="font-size:13px;color:var(--green);margin-top:8px">✓ Mongo responde rápido desde el servidor.</div>':'')}${m.error?'<div class="mal">'+m.error+'</div>':''}</div>
  <div class="card"><h3>StelOrder</h3><div class="kv"><span>Llamada a StelOrder (proveedores)</span>${ms(s.documentStatesMs,500,2000)}</div><div style="font-size:12px;color:var(--text3);margin-top:8px;line-height:1.6">Caché: ${(s.cache||[]).join(' · ')||'vacía'}</div>${s.error?'<div class="mal">'+s.error+'</div>':''}</div>`;
  document.getElementById('raw').textContent=JSON.stringify({...d,cliente:{archivoMs:estatico,totalMs:total},whatsapp:window._wa||null},null,2);}
// ── WHATSAPP ──
const ERR={63016:'Fuera de la ventana de 24 h: ese número no ha escrito al bot en las últimas 24 h (y no hay plantilla aprobada).',63015:'Sandbox: el destinatario no está unido al sandbox o su unión caducó (hay que volver a enviar «join …» al número del sandbox; caduca a los 3 días).',63007:'El número remitente (TWILIO_WHATSAPP_FROM) no está habilitado para WhatsApp en esta cuenta.',63003:'El número de destino no es válido para WhatsApp.',21211:'Número de destino no válido.',21608:'Cuenta de prueba: solo puede enviar a números verificados.',20003:'Credenciales de Twilio incorrectas (SID o token).',21606:'El remitente no es válido para ese canal.',63018:'Límite de envíos de WhatsApp superado.'};
function hace(t){if(!t)return 'nunca';const s=Math.round((Date.now()-new Date(t))/1000);return s<60?s+' s':s<3600?Math.round(s/60)+' min':s<86400?Math.round(s/3600)+' h':Math.round(s/86400)+' días';}
async function wa(){const el=document.getElementById('wa');let d;try{const r=await fetch('/api/diag/whatsapp',{headers:{'Authorization':'Bearer '+tok}});d=await r.json();if(!r.ok)throw new Error(d.error||'HTTP '+r.status);}catch(e){el.innerHTML='<div class="card mal">WhatsApp: ❌ '+e.message+'</div>';return;}
  window._wa=d;const p=d.puente||{},t=d.twilio||{},c=d.config||{};
  const errs=(t.ultimos||[]).filter(m=>m.errorCode);const ultErr=errs[0];
  const diag=[];
  if(!p.conectado)diag.push(`🔴 <b>El puente (Baileys) no está sondeando</b>: último contacto hace ${hace(p.ultimoSondeo)}. El contenedor del VPS está parado o la sesión de WhatsApp se ha desvinculado.`);
  if(p.pendientes)diag.push(`🟠 Hay <b>${p.pendientes}</b> mensajes esperando en el buzón del puente (el más antiguo de hace ${hace(p.pendienteMasAntiguo)}).`);
  if(t.error)diag.push(`🔴 <b>Twilio da error</b>: ${t.error}${t.code?' ('+t.code+')':''}.`);
  if(ultErr)diag.push(`🔴 Último error de Twilio (${hace(ultErr.fecha)}): <b>${ultErr.errorCode}</b> — ${ERR[ultErr.errorCode]||ultErr.errorMessage||''}`);
  if(t.cuenta&&t.cuenta.estado!=='active')diag.push(`🔴 La cuenta de Twilio está <b>${t.cuenta.estado}</b>.`);
  if(!diag.length)diag.push('✓ No veo fallos en los datos: prueba un envío abajo.');
  const fila=(m)=>`<div class="kv" style="font-size:12.5px"><span>${hace(m.fecha||m.ts)} · ${m.direccion?m.direccion.replace('outbound-api','salida').replace('inbound','entrada')+' · ':''}${m.to||''} · «${(m.texto||'').replace(/</g,'&lt;')}»</span><b class="${m.errorCode||m.estado==='failed'||m.estado==='undelivered'?'mal':(m.estado==='pending'?'reg':'ok')}">${m.estado||m.status}${m.errorCode?' '+m.errorCode:''}</b></div>`;
  el.innerHTML=`<div class="card"><h3>WhatsApp · diagnóstico</h3><div style="line-height:1.6;font-size:14px">${diag.join('<br>')}</div>
    <div class="kv"><span>Canal activo</span><b>${d.canalActivo}</b></div><div class="kv"><span>Remitente Twilio</span><b>${c.TWILIO_WHATSAPP_FROM||'—'}</b></div><div class="kv"><span>Cuenta Twilio</span><b>${t.cuenta?t.cuenta.estado+' · '+t.cuenta.tipo:'—'}</b></div><div class="kv"><span>Puente: último sondeo</span><b class="${p.conectado?'ok':'mal'}">hace ${hace(p.ultimoSondeo)}</b></div><div class="kv"><span>Última entrada por Twilio</span><b>hace ${hace(d.ultimaEntradaTwilio)}</b></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><input id="wa-to" placeholder="+34…" style="flex:1;min-width:160px;padding:10px;border-radius:10px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font:inherit"><button class="btn" onclick="probar('twilio')">Probar Twilio</button><button class="btn" onclick="probar('bridge')">Probar puente</button></div><div id="wa-prueba" style="margin-top:8px;font-size:13px"></div></div>
  <div class="card"><h3>Últimos mensajes Twilio</h3>${(t.ultimos||[]).map(fila).join('')||'<div style="color:var(--text3)">—</div>'}</div>
  <div class="card"><h3>Buzón del puente (últimos)</h3>${(p.ultimos||[]).map(fila).join('')||'<div style="color:var(--text3)">—</div>'}</div>`;
  try{document.getElementById('wa-to').value=localStorage.getItem('waTo')||'';}catch(e){}}
async function probar(canal){const to=document.getElementById('wa-to').value.trim();const el=document.getElementById('wa-prueba');if(!to){el.textContent='Pon un número';return;}try{localStorage.setItem('waTo',to);}catch(e){}
  el.innerHTML='Enviando…';try{const r=await fetch('/api/diag/whatsapp/prueba',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({to,canal})});const d=await r.json();
  el.innerHTML=d.ok?`<span class="ok">✓ ${canal}: ${d.estado||''} ${d.nota||''}</span>`:`<span class="mal">✗ ${canal}: ${d.errorCode?d.errorCode+' — '+(ERR[d.errorCode]||d.errorMessage||''):(d.error||'')}${d.code&&!d.errorCode?' ('+d.code+')':''}</span>`;
  document.getElementById('raw').textContent=JSON.stringify({prueba:{canal,...d},whatsapp:window._wa},null,2);setTimeout(wa,canal==='bridge'?45000:1500);}catch(e){el.innerHTML='<span class="mal">'+e.message+'</span>';}}
if(tok)wa();
if(!tok)document.getElementById('res').innerHTML='<div class="card mal">Abre esta página desde el dashboard (necesita sesión de Dueño).</div>';else medir();
</script></body></html>
