<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documentación para entrar — Corp Projects</title><link rel="stylesheet" href="/tool-theme.css">
<meta name="theme-color" content="#4d9cf8">
<style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0c0e12;--bg2:#13161c;--bg3:#1a1e27;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.15);--text:#f0f2f7;--text2:#8b92a8;--text3:#5a6278;--green:#22c487;--red:#f05252;--blue:#4d9cf8;--amber:#f59e0b}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;min-height:100vh}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.logo{width:32px;height:32px;background:linear-gradient(135deg,#4d9cf8,#22c487);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.hbtn{margin-left:auto;background:none;border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:6px 12px;font-size:13px;text-decoration:none;white-space:nowrap}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
h3{font-size:12px;margin:0 0 10px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.btn,input,select{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;color:var(--text);padding:8px 12px;font:inherit;font-size:14px;text-decoration:none;max-width:100%}
.btn{cursor:pointer;display:inline-flex;align-items:center;gap:6px}.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}.btn.peq{padding:5px 10px;font-size:13px}.btn:disabled{opacity:.5;cursor:wait}
.fila{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--border);align-items:center}.fila:last-child{border-bottom:0}
.fila .n{font-weight:600;font-size:14px}.fila .s{font-size:12.5px;color:var(--text3);margin-top:2px}
.est{font-size:11.5px;border-radius:99px;padding:2px 9px;border:1px solid var(--border2);white-space:nowrap}
.est.ok{color:var(--green);border-color:rgba(34,196,135,.5)}.est.falta{color:var(--red);border-color:rgba(240,82,82,.5)}.est.caducado{color:var(--amber);border-color:rgba(245,158,11,.5)}.est.opc{color:var(--text3)}
.barra{height:10px;border-radius:99px;background:var(--bg3);overflow:hidden;margin:8px 0 4px}.barra div{height:100%;background:linear-gradient(90deg,#4d9cf8,#22c487)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--border2);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--text2);background:var(--bg3);cursor:pointer;user-select:none}.chip.on{color:var(--text);border-color:rgba(77,156,248,.6);background:rgba(77,156,248,.14)}
.acc{display:flex;gap:8px;flex-wrap:wrap}
.cfg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.cfg label{font-size:12px;color:var(--text3);display:block;margin-bottom:4px}.cfg select,.cfg input{width:100%}
.vacio{color:var(--text3);font-size:14px;padding:6px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border2);padding:10px 16px;border-radius:10px;display:none;z-index:50;max-width:92vw}
@media(max-width:700px){.cfg{grid-template-columns:1fr}.fila{grid-template-columns:minmax(0,1fr) auto}.fila .est{grid-column:1/3;justify-self:start}}
</style><link rel="stylesheet" href="/cp-ui.css">
<script src="/nav.js" defer></script>
</head><body><script>try{if(localStorage.getItem("cp_theme")==="light")document.body.classList.add("light");}catch(e){}</script>
<div class="header"><div class="logo">CP</div><div><div style="font-weight:600">Documentación para entrar en obra</div><div style="font-size:12px;color:var(--text3)">Lo que pide el contratista, lo que tenemos y quién da lo que falta</div></div><a class="hbtn" href="/">← Dashboard</a></div>
<div id="toast"></div>
<div class="wrap"><div id="out"><div class="vacio">Cargando…</div></div></div>
<script>
const tok=localStorage.getItem('cp_token');const H={'Authorization':'Bearer '+tok};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'';
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>e.style.display='none',4000);}
async function api(m,u,b){const o={method:m,headers:{...H}};if(b instanceof FormData)o.body=b;else if(b){o.headers['Content-Type']='application/json';o.body=JSON.stringify(b);}const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'HTTP '+r.status);return d;}
const obraId=new URLSearchParams(location.search).get('obra');
let E=null,PLANT=[];
async function cargar(){if(!tok){document.getElementById('out').innerHTML='<div class="card">Abre esta página desde el dashboard.</div>';return;}
  if(!obraId)return elegirObra();
  try{[E,PLANT]=await Promise.all([api('GET',`/api/obras/${obraId}/docs-entrada`),api('GET','/api/personal/resumen').then(r=>r.trabajadores)]);}catch(e){document.getElementById('out').innerHTML='<div class="card" style="color:var(--red)">'+esc(e.message)+'</div>';return;}
  pintar();}
async function elegirObra(){let os=[];try{os=await api('GET','/api/obras/selector');}catch(e){}
  document.getElementById('out').innerHTML=`<div class="card"><h3>¿Para qué obra?</h3><select id="sel" style="width:100%"><option value="">Elige la obra…</option>${os.filter(o=>o.grupo!=='antigua').map(o=>`<option value="${o.id}">${esc(o.reference)}${o.clientName?' — '+esc(o.clientName):''}</option>`).join('')}</select><div class="vacio" style="margin-top:8px">Si la obra aún no existe, créala primero en Obras.</div></div>`;
  document.getElementById('sel').onchange=e=>{if(e.target.value)location.href='/docs-obra?obra='+e.target.value;};}
const EST={ok:'✔ lo tenemos',falta:'falta',caducado:'caducado'};
function fila(f,ctx){const subir=`<label class="btn peq" style="cursor:pointer">⬆ Subir<input type="file" accept="application/pdf,image/*" style="display:none" onchange="subir(this,'${f.de}','${f.tipo}','${ctx||''}')"></label>`;
  return `<div class="fila"><span class="est ${f.opcional&&f.estado!=='ok'?'opc':f.estado}">${f.opcional&&f.estado!=='ok'?'si procede':EST[f.estado]}</span><div><div class="n">${esc(f.nombre)}</div><div class="s">${f.estado==='ok'?esc(f.archivo||'')+(f.caduca?' · válido hasta '+fd(f.caduca):''):esc(f.quienTxt)}${f.nota?' · '+esc(f.nota):''}</div></div><div class="acc">${f.docId?`<a class="btn peq" href="#" onclick="event.preventDefault();ver('${f.docId}')">Ver</a>`:''}${subir}</div></div>`;}
function pintar(){const c=E.config,hechos=E.total-E.faltan,pct=E.total?Math.round(hechos/E.total*100):0;
  const sel=new Set(c.userIds||[]);
  const dni=E.trabajadores.filter(t=>t.filas.some(f=>f.tipo==='dni'&&f.estado!=='ok'));
  const nq=q=>(E.porQuien[q]||[]).length;
  document.getElementById('out').innerHTML=`
  <div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><div><div style="font-size:20px;font-weight:800">${esc(E.obra.ref)}</div><div class="s" style="color:var(--text3);font-size:13px">${esc(E.obra.cliente||'')} ${E.obra.direccion?'· '+esc(E.obra.direccion):''}</div></div>
    <div style="text-align:right"><div style="font-size:24px;font-weight:800;color:${E.faltan?'var(--amber)':'var(--green)'}">${E.faltan?'Faltan '+E.faltan:'✔ Todo listo'}</div><div style="font-size:13px;color:var(--text3)">${hechos} de ${E.total} documentos${E.dias!=null?` · ${E.dias>0?'entráis en '+E.dias+' día'+(E.dias===1?'':'s'):E.dias===0?'entráis HOY':'ya entrasteis'} (${fd(c.fechaEntrada)})`:''}</div></div></div>
    <div class="barra"><div style="width:${pct}%"></div></div>${E.enviado?`<div class="s" style="color:var(--green);font-size:13px">✔ Enviado el ${fd(E.enviado.at)}${E.enviado.por?' por '+esc(E.enviado.por):''}</div>`:''}</div>
  <div class="card"><h3>La obra</h3><div class="cfg">
    <div><label>Lista del contratista</label><select id="c-pl">${E.plantillas.map(p=>`<option value="${p.id}" ${p.id===c.plantilla?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></div>
    <div><label>Día de entrada</label><input type="date" id="c-fe" value="${esc(c.fechaEntrada||'')}"></div>
    <div><label>Enviar a</label><input id="c-de" value="${esc((c.destino||[]).join(', '))}" placeholder="documentacion@…"></div></div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13.5px;color:var(--text2)"><input type="checkbox" id="c-maq" ${c.maquinaria?'checked':''}> Llevamos maquinaria (pide carnet, autorización y formación de maquinaria)</label>
    <div style="margin-top:12px"><label style="font-size:12px;color:var(--text3);display:block;margin-bottom:6px">¿Quién va a ir?</label><div class="chips">${PLANT.map(w=>`<span class="chip ${sel.has(w.id)?'on':''}" data-u="${w.id}" onclick="this.classList.toggle('on')">${esc(w.name)}</span>`).join('')}</div></div>
    <div style="margin-top:12px"><button class="btn pri" onclick="guardar()">Guardar</button></div></div>
  ${E.faltan?`<div class="card"><h3>Pedir lo que falta · un clic</h3><div class="acc">
    ${nq('gestoria')?`<button class="btn" onclick="borrador('gestoria',this)">📧 Correo a la gestoría (${nq('gestoria')})</button>`:''}
    ${nq('prevencion')?`<button class="btn" onclick="borrador('prevencion',this)">📧 Correo al servicio de prevención (${nq('prevencion')})</button>`:''}
    ${dni.map(t=>`<button class="btn" onclick="pedirDni('${t.userId}','${esc(t.nombre).replace(/'/g,'')}',this)">📲 Pedir DNI y SS a ${esc(t.nombre.split(' ')[0])}</button>`).join('')}</div>
    <div class="s" style="font-size:12.5px;color:var(--text3);margin-top:8px">Los correos se quedan preparados en Gmail (borradores): los revisas y los envías tú. ${nq('aseguradora')?'Seguros: búscalos en el correo o pídeselos a la aseguradora y súbelos aquí. ':''}${nq('firmar')?'Formularios del contratista: imprímelos, fírmalos y séllalos, y sube el escaneo aquí.':''}</div></div>`:''}
  <div class="card"><h3>Empresa</h3>${E.general.filter(f=>f.de==='empresa').map(f=>fila(f)).join('')}</div>
  <div class="card"><h3>De esta obra (firmar y sellar)</h3>${E.general.filter(f=>f.de==='obra').map(f=>fila(f)).join('')}</div>
  ${E.trabajadores.length?E.trabajadores.map(t=>{const ok=t.filas.filter(f=>f.estado==='ok').length;return `<div class="card"><h3>${esc(t.nombre)} · ${ok} de ${t.filas.length}</h3>${t.filas.map(f=>fila(f,t.userId)).join('')}</div>`;}).join(''):'<div class="card"><div class="vacio">Marca arriba quién va a ir para ver sus documentos.</div></div>'}
  <div class="card"><h3>Enviar al contratista</h3><div class="acc"><button class="btn pri" onclick="paquete(this)">📦 Preparar el correo con todo (ZIP)</button><button class="btn" onclick="descargar(this)">⬇ Descargar el ZIP</button>${E.enviado?'':`<button class="btn" onclick="enviado()">✔ Ya lo hemos enviado</button>`}</div>
    <div class="s" style="font-size:12.5px;color:var(--text3);margin-top:8px">Se prepara en Gmail para ${esc((c.destino||[]).join(', ')||'(pon a quién)')} con un ZIP ordenado (Empresa / Obra / cada trabajador) y un índice de lo que va y lo que falta. Lo revisas y lo envías.</div></div>`;}
async function guardar(){const userIds=[...document.querySelectorAll('.chip.on')].map(x=>x.dataset.u);
  try{await api('POST',`/api/obras/${obraId}/docs-entrada`,{plantilla:document.getElementById('c-pl').value,fechaEntrada:document.getElementById('c-fe').value,maquinaria:document.getElementById('c-maq').checked,userIds,destino:document.getElementById('c-de').value.split(/[,;\s]+/).filter(Boolean)});toast('Guardado');cargar();}catch(e){toast(e.message);}}
async function subir(inp,de,tipo,uid){const f=inp.files[0];if(!f)return;const fdat=new FormData();fdat.append('archivo',f);fdat.append('ambito',de);fdat.append('tipo',tipo);if(de==='trabajador')fdat.append('userId',uid);if(de==='obra')fdat.append('obraId',obraId);
  const fe=await (window.CPDialog?CPDialog.pedir('Fecha del documento (para saber hasta cuándo vale). Déjalo vacío si no la sabes:',{placeholder:'AAAA-MM-DD'}):Promise.resolve(''));if(fe===null)return;if(fe&&/^\d{4}-\d{2}-\d{2}$/.test(fe))fdat.append('fecha',fe);
  try{await api('POST','/api/personal/docs',fdat);toast('Subido');cargar();}catch(e){toast(e.message);}}
async function ver(id){try{const r=await fetch('/api/personal/docs/'+id+'/archivo',{headers:H});if(!r.ok)throw new Error('No se pudo abrir');const b=await r.blob();window.open(URL.createObjectURL(b),'_blank');}catch(e){toast(e.message);}}
async function borrador(quien,b){b.disabled=true;try{const r=await api('POST',`/api/obras/${obraId}/docs-entrada/borrador`,{quien});window.open(r.url,'_blank');toast('Correo preparado en Gmail (borradores). Revísalo y envíalo.');}catch(e){toast(e.message);}b.disabled=false;}
async function pedirDni(uid,nombre,b){if(!confirm(`¿Que Corpy le pida a ${nombre} por WhatsApp el DNI/NIE por las dos caras y el nº de la Seguridad Social?`))return;b.disabled=true;try{const r=await api('POST','/api/personal/pedir-docs-alta',{userId:uid});toast('Enviado a '+r.a);}catch(e){toast(e.message);}b.disabled=false;}
async function paquete(b){b.disabled=true;b.textContent='Preparando…';try{const r=await api('POST',`/api/obras/${obraId}/docs-entrada/paquete`,{});window.open(r.url,'_blank');toast(r.faltan?`Preparado en Gmail. OJO: aún faltan ${r.faltan}.`:'Preparado en Gmail con todo. Revísalo y envíalo.');}catch(e){toast(e.message);}b.disabled=false;b.textContent='📦 Preparar el correo con todo (ZIP)';}
async function descargar(b){b.disabled=true;try{const r=await fetch(`/api/obras/${obraId}/docs-entrada/paquete`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({descargar:true})});if(!r.ok)throw new Error('No se pudo preparar');const bl=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='Documentacion_'+(E.obra.ref||'obra')+'.zip';a.click();}catch(e){toast(e.message);}b.disabled=false;}
async function enviado(){if(!confirm('¿Marcar que ya se ha enviado al contratista? Deja de salir en Inicio.'))return;try{await api('POST',`/api/obras/${obraId}/docs-entrada/enviado`);cargar();}catch(e){toast(e.message);}}
cargar();
</script><script src="/dialogo.js"></script></body></html>
