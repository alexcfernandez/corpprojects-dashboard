<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Presupuestos — Corp Projects</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/tool-theme.css">
<meta name="theme-color" content="#4d9cf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Corp Projects">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0c0e12;--bg2:#13161c;--bg3:#1a1e27;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.15);
  --text:#f0f2f7;--text2:#8b92a8;--text3:#5a6278;--green:#22c487;--red:#f05252;--blue:#4d9cf8;--amber:#f59e0b;--purple:#a78bfa;--r:12px;--rs:10px;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;min-height:100vh;padding-bottom:150px}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#4d9cf8,#22c487);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.header-text{font-weight:600;font-size:15px}.header-sub{font-size:12px;color:var(--text3);margin-top:1px}
.header-logout{margin-left:auto;background:none;border:1px solid var(--border2);border-radius:8px;color:var(--text3);padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.page{display:none}.page.active{display:block}.container{padding:20px;max-width:680px;margin:0 auto}
.login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:28px 24px;margin-top:24px}
.login-title{font-size:18px;font-weight:600;margin-bottom:4px;text-align:center}.login-sub{font-size:13px;color:var(--text3);text-align:center;margin-bottom:24px}
.worker-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.worker-btn{background:var(--bg3);border:2px solid var(--border);border-radius:var(--r);padding:14px 10px;text-align:center;cursor:pointer;font-family:inherit}
.worker-btn.selected{border-color:var(--blue);background:rgba(77,156,248,.1)}.worker-name{font-size:13px;font-weight:600;color:var(--text)}
.pin-input{width:100%;background:var(--bg3);border:2px solid var(--border2);border-radius:var(--rs);padding:14px;color:var(--text);font-size:24px;font-weight:700;text-align:center;letter-spacing:8px;outline:none;font-family:monospace}
.btn{width:100%;background:var(--blue);border:none;border-radius:var(--r);padding:15px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.55}.btn.sec{background:none;border:1px solid var(--border2);color:var(--text2)}.btn.danger{background:none;border:1px solid var(--red);color:var(--red)}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
select,input[type=text],input[type=number]{width:100%;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--rs);padding:12px 13px;color:var(--text);font-size:15px;outline:none;font-family:inherit;-webkit-appearance:none}
label.fld{display:block;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);max-width:92%;min-width:240px;padding:13px 18px;border-radius:12px;font-size:15px;font-weight:500;z-index:300;opacity:0;pointer-events:none;transition:all .22s;box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:#12301f;border:1px solid var(--green);color:#7ff0c0}#toast.warn{background:#33280d;border:1px solid var(--amber);color:#ffd98a}#toast.error{background:#3a1414;border:1px solid var(--red);color:#ff9d9d}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.tool-btn{background:none;border:1px solid var(--border2);border-radius:var(--rs);color:var(--text3);padding:9px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.addbtn{margin-left:auto;background:var(--blue);border:none;border-radius:var(--rs);color:#fff;font-weight:600;padding:9px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;margin-bottom:9px;cursor:pointer}
.card:hover{border-color:var(--border2)}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-nm{font-weight:600;font-size:15px}.card-cli{font-size:13px;color:var(--text3);margin-top:2px}
.card-tot{font-size:13px;color:var(--text2);margin-top:6px;font-variant-numeric:tabular-nums}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:20px;background:var(--bg3);color:var(--text3)}
.empty{text-align:center;color:var(--text3);font-size:14px;padding:40px 20px}
/* detalle */
.det-head input{font-size:16px;font-weight:600;margin-bottom:8px}
.med-ref{background:rgba(77,156,248,.08);border:1px solid rgba(77,156,248,.25);border-radius:var(--rs);padding:10px 12px;font-size:12px;color:var(--text2);margin-bottom:12px}
.med-ref b{color:var(--text)}
.linea{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 13px;margin-bottom:8px}
.l-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.l-nom{font-weight:600;font-size:14px}
.l-del{background:rgba(240,82,82,.12);border:1px solid var(--red);color:var(--red);border-radius:7px;width:30px;height:32px;font-size:15px;cursor:pointer;flex-shrink:0}
.l-in{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.l-cant{width:90px;text-align:right}
.l-u{font-size:13px;color:var(--text3)}
.l-calc{margin-left:auto;font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap}
.l-calc b{color:var(--text);font-size:14px}
.l-quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.l-quick button{background:var(--bg3);border:1px solid var(--border2);border-radius:100px;color:var(--text2);padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.l-quick button:hover{border-color:var(--blue);color:var(--text)}
/* secciones (títulos con subtotal) */
.seccion{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border2);border-left:3px solid var(--blue);border-radius:8px;padding:8px 10px;margin:16px 0 8px}
.s-nom{flex:1;min-width:0;background:transparent;border:none;font-weight:700;font-size:15px;color:var(--text);padding:4px 2px;outline:none;font-family:inherit}
.s-sub{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text2);font-size:13px;white-space:nowrap}
/* líneas libres (concepto a mano) */
.linea.libre .l-nomin{width:100%;background:var(--bg3);border:1.5px solid var(--border2);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;font-weight:600;outline:none;font-family:inherit}
.linea.libre .l-cant{width:80px !important;text-align:right}
.linea.libre .l-unid{width:52px !important;text-align:center;padding:12px 4px !important}
.linea.libre .l-precio{width:92px !important;text-align:right}
.l-x{color:var(--text3);font-size:13px}
.addrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.addrow .btn{flex:1;min-width:100px;padding:12px 8px;font-size:14px}
.totbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--border2);padding:12px 20px;z-index:15}
.totbar-in{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.totals{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-variant-numeric:tabular-nums}
.totals b{font-size:16px}.totals .lbl{color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;display:block}
.savebtn{margin-left:auto;background:var(--green);border:none;border-radius:var(--rs);color:#062015;font-weight:700;padding:11px 20px;font-size:14px;cursor:pointer;font-family:inherit}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:20px}
@media(min-width:600px){.overlay{align-items:center}.modal{border-radius:18px}}
.field{margin-bottom:14px}.row2{display:flex;gap:8px}.row2>*{flex:1}
.pick{padding:11px 8px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.pick:hover{background:var(--bg3)}
.hint{font-size:12px;color:var(--text3);margin-top:5px}
</style>
</head>
<body>
<script>try{if(localStorage.getItem("cp_theme")==="light")document.body.classList.add("light");}catch(e){}</script>

<div class="header">
  <div class="logo">CP</div>
  <div><div class="header-text">Presupuestos</div><div class="header-sub" id="header-sub"></div></div>
  <button class="header-logout" id="logout-btn" onclick="logout()" style="display:none">Salir</button>
</div>
<div id="toast"></div>

<!-- LOGIN -->
<div class="page" id="page-login"><div class="container"><div class="login-card">
  <div class="login-title">Acceso oficina</div><div class="login-sub">Elige tu nombre e introduce el PIN</div>
  <div class="worker-grid" id="worker-selector"></div>
  <input type="tel" inputmode="numeric" id="pin-input" class="pin-input" placeholder="••••" maxlength="6" onkeydown="if(event.key==='Enter')doLogin()">
  <div style="height:16px"></div><button class="btn" id="login-btn" onclick="doLogin()">Entrar →</button>
</div></div></div>

<!-- LISTA -->
<div class="page" id="page-list"><div class="container">
  <div class="toolbar"><span style="font-size:13px;color:var(--text3)" id="count"></span><button class="addbtn" onclick="nuevo()">+ Nuevo presupuesto</button></div>
  <div id="lista"></div>
</div></div>

<!-- DETALLE -->
<div class="page" id="page-det"><div class="container">
  <div class="toolbar"><button class="tool-btn" onclick="volver()">← Presupuestos</button><button class="tool-btn danger" onclick="eliminarPres()" id="det-del" style="display:none">Eliminar</button></div>
  <input type="text" id="d-nombre" class="det-head" placeholder="Nombre del presupuesto" style="width:100%">
  <input type="text" id="d-cliente" autocomplete="off" placeholder="Cliente" style="margin-bottom:10px">
  <div class="med-ref" id="d-medref" style="display:none"></div>
  <div id="lineas"></div>
  <div class="addrow">
    <button class="btn sec" onclick="abrirPicker()"><i></i>+ Partida</button>
    <button class="btn sec" onclick="addLibre()">+ Línea libre</button>
    <button class="btn sec" onclick="addSeccion()">+ Sección</button>
  </div>
</div></div>

<!-- BARRA TOTALES -->
<div class="totbar" id="totbar" style="display:none"><div class="totbar-in">
  <div class="totals">
    <div><span class="lbl">Venta</span><b id="t-venta" style="color:var(--green)">0 €</b></div>
    <div><span class="lbl">Coste</span><b id="t-coste" style="color:var(--red)">0 €</b></div>
    <div><span class="lbl">Margen</span><b id="t-margen">0%</b></div>
  </div>
  <button class="savebtn" onclick="guardar()">Guardar</button>
</div></div>

<!-- NUEVO -->
<div class="overlay" id="ov-nuevo"><div class="modal">
  <div style="font-weight:700;font-size:17px;margin-bottom:14px">Nuevo presupuesto</div>
  <div class="field"><label class="fld">Nombre</label><input type="text" id="n-nombre" placeholder="Ej. Reforma piso C/ Comerç 76"></div>
  <div class="field"><label class="fld">Cliente (opcional)</label><input type="text" id="n-cliente" autocomplete="off" placeholder="Busca en StelOrder"></div>
  <div class="field"><label class="fld">Medición (opcional — para cantidades automáticas)</label><select id="n-medicion"><option value="">— Sin medición —</option></select></div>
  <div class="row2"><button class="btn sec" onclick="cerrar('ov-nuevo')">Cancelar</button><button class="btn" onclick="crearNuevo()">Crear</button></div>
</div></div>

<!-- PICKER PARTIDA -->
<div class="overlay" id="ov-pick"><div class="modal">
  <div style="font-weight:700;font-size:16px;margin-bottom:10px">Añadir partida</div>
  <input type="text" id="pk-search" placeholder="Buscar partida…" oninput="renderPick()" style="margin-bottom:10px">
  <div id="pk-list" style="max-height:56vh;overflow-y:auto"></div>
</div></div>

<script src="/cliente-autocomplete.js"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}
let workerToken=null, esAdmin=false, todosWorkers=[], lista=[], pres=null, catalogo=[], mediciones=[];
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+id).classList.add('active');document.getElementById('totbar').style.display=id==='det'?'block':'none';}
let _tt=null;function toast(t,ty){const e=document.getElementById('toast');e.textContent=t;e.className='show '+(ty||'ok');clearTimeout(_tt);_tt=setTimeout(()=>e.className='',3200);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function authH(x){return Object.assign({'Authorization':`Bearer ${workerToken}`},x||{});}
function eur(n){return (Number(n)||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
function fmt(n){return (Number(n)||0).toLocaleString('es-ES',{maximumFractionDigits:2});}
async function api(m,u,b){const o={method:m,headers:authH(b?{'Content-Type':'application/json'}:{})};if(b)o.body=JSON.stringify(b);const r=await fetch(u,o);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Error');return r.json().catch(()=>({}));}
function abrir(id){document.getElementById(id).classList.add('show');}function cerrar(id){document.getElementById(id).classList.remove('show');}

// ── LOGIN + SSO ──
async function loadWorkers(){try{const r=await fetch('/api/partes/workers');todosWorkers=await r.json();document.getElementById('worker-selector').innerHTML=todosWorkers.map(w=>`<button class="worker-btn" data-id="${w.id}" onclick="selW(this)"><div class="worker-name">${esc(w.name)}</div></button>`).join('');}catch(e){}}
function selW(b){document.querySelectorAll('.worker-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('pin-input').focus();}
async function enterApp(token,info,persist){workerToken=token;esAdmin=!!info.admin;
  if(persist){localStorage.setItem('cpWT',token);localStorage.setItem('cpWN',info.workerName||'');}
  document.getElementById('header-sub').textContent=info.workerName||'';
  const lb=document.getElementById('logout-btn');lb.textContent=esAdmin?'← Dashboard':'Salir';lb.style.display='block';
  if(window.initClienteAutocomplete){initClienteAutocomplete(document.getElementById('d-cliente'),workerToken);initClienteAutocomplete(document.getElementById('n-cliente'),workerToken);}
  showPage('list');await cargar();}
async function tryRestore(){const admin=localStorage.getItem('cp_token'),worker=localStorage.getItem('cpWT');
  for(const [t,isA] of [[admin,true],[worker,false]]){if(!t)continue;try{const r=await fetch('/api/oficina/whoami',{headers:{'Authorization':`Bearer ${t}`}});if(!r.ok)continue;const d=await r.json();await enterApp(t,{workerName:d.name,admin:d.admin},!isA);return true;}catch(e){}}
  localStorage.removeItem('cpWT');return false;}
async function doLogin(){const sel=document.querySelector('.worker-btn.selected');if(!sel){toast('Selecciona tu nombre','warn');return;}const pin=document.getElementById('pin-input').value;if(pin.length<4){toast('Introduce el PIN','warn');return;}
  const b=document.getElementById('login-btn');b.disabled=true;b.innerHTML='<span class="spinner"></span>…';
  try{const r=await fetch('/api/partes/worker-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workerId:sel.dataset.id,pin})});const d=await r.json();if(!r.ok)throw new Error(d.error||'PIN incorrecto');await enterApp(d.token,{workerId:d.workerId,workerName:d.workerName},true);}
  catch(e){toast(e.message,'error');document.getElementById('pin-input').value='';}finally{b.disabled=false;b.innerHTML='Entrar →';}}
function logout(){if(esAdmin){location.href='/';return;}workerToken=null;localStorage.removeItem('cpWT');localStorage.removeItem('cpWN');document.getElementById('logout-btn').style.display='none';showPage('login');}

// ── LISTA ──
async function cargar(){document.getElementById('lista').innerHTML='<div class="empty"><span class="spinner"></span></div>';
  try{lista=await api('GET','/api/presupuestos');renderLista();}catch(e){toast(e.message,'error');}}
function renderLista(){
  document.getElementById('count').textContent=`${lista.length} presupuesto(s)`;
  if(!lista.length){document.getElementById('lista').innerHTML='<div class="empty">Aún no hay presupuestos. Pulsa «+ Nuevo presupuesto».</div>';return;}
  document.getElementById('lista').innerHTML=lista.map(p=>`<div class="card" onclick="abrirPres('${p._id}')">
    <div class="card-top"><div class="card-nm">${esc(p.nombre)}</div><span class="badge">${esc(p.estado||'borrador')}</span></div>
    ${p.clientName?`<div class="card-cli">${esc(p.clientName)}</div>`:''}
    <div class="card-tot">${p.nLineas} partida(s) · <b style="color:var(--green)">${eur(p.totalVenta)}</b>${p.margen?` · margen ${p.margen}%`:''}</div>
  </div>`).join('');
}
function volver(){pres=null;cargar();showPage('list');}

// ── NUEVO ──
async function nuevo(){
  document.getElementById('n-nombre').value='';document.getElementById('n-cliente').value='';
  try{mediciones=await api('GET','/api/mediciones');}catch(e){mediciones=[];}
  document.getElementById('n-medicion').innerHTML='<option value="">— Sin medición —</option>'+mediciones.map(m=>`<option value="${m._id}">${esc(m.nombre)} (suelo ${fmt(m.totales.suelo)} m²)</option>`).join('');
  abrir('ov-nuevo');
}
async function crearNuevo(){
  const nombre=document.getElementById('n-nombre').value.trim();if(!nombre){toast('Ponle un nombre','warn');return;}
  const medId=document.getElementById('n-medicion').value;
  const med=mediciones.find(m=>String(m._id)===String(medId));
  try{const r=await api('POST','/api/presupuestos',{nombre,clientName:document.getElementById('n-cliente').value.trim(),medicionId:medId||null,medicionTotales:med?med.totales:null});cerrar('ov-nuevo');await abrirPres(r.id);}catch(e){toast(e.message,'error');}
}

// ── DETALLE ──
async function abrirPres(id){
  try{pres=await api('GET','/api/presupuestos/'+id);
    document.getElementById('d-nombre').value=pres.nombre||'';document.getElementById('d-cliente').value=pres.clientName||'';
    document.getElementById('det-del').style.display='block';
    const mt=pres.medicionTotales;const mr=document.getElementById('d-medref');
    if(mt){mr.style.display='block';mr.innerHTML=`📐 Medición: <b>Suelo ${fmt(mt.suelo)}</b> · <b>Paredes ${fmt(mt.paredes)}</b> · <b>Techo ${fmt(mt.techo)}</b> · <b>Pintura ${fmt((mt.paredes||0)+(mt.techo||0))}</b> m² · <b>Rodapié ${fmt(mt.rodapie)}</b> m`;}
    else mr.style.display='none';
    if(!catalogo.length){try{const c=await api('GET','/api/partidas');catalogo=c.partidas||[];}catch(e){}}
    renderLineas();showPage('det');
  }catch(e){toast(e.message,'error');}
}
function medQuick(unidad){
  const mt=pres&&pres.medicionTotales;if(!mt)return[];
  if(unidad==='m²')return [['Suelo',mt.suelo],['Paredes',mt.paredes],['Techo',mt.techo],['Pintura',(mt.paredes||0)+(mt.techo||0)]];
  if(unidad==='ml')return [['Rodapié',mt.rodapie]];
  return [];
}
function tipoDe(l){return (l&&l.tipo)||'partida';}
function subtotalDesde(i){ // suma de las líneas (no-sección) hasta la próxima sección
  let s=0;for(let j=i+1;j<pres.lineas.length;j++){const l=pres.lineas[j];if(tipoDe(l)==='seccion')break;s+=(l.cantidad||0)*(l.precioVenta||0);}return s;
}
function renderLineas(){
  const cont=document.getElementById('lineas');
  if(!pres.lineas||!pres.lineas.length){cont.innerHTML='<div class="empty" style="padding:24px">Vacío. Añade una partida, una línea libre o una sección.</div>';recompute();return;}
  cont.innerHTML=pres.lineas.map((l,i)=>{
    const tipo=tipoDe(l);
    if(tipo==='seccion') return `<div class="seccion">
      <input class="s-nom" value="${esc(l.nombre)}" oninput="onSecNom(${i},this.value)" placeholder="Título de sección (Cocina, Baño…)">
      <span class="s-sub" id="ss-${i}">${eur(subtotalDesde(i))}</span>
      <button class="l-del" onclick="delLinea(${i})">×</button>
    </div>`;
    const quick=medQuick(l.unidad).filter(q=>q[1]>0).map(q=>`<button onclick="quickFill(${i},${q[1]})">${q[0]} ${fmt(q[1])}</button>`).join('');
    if(tipo==='libre') return `<div class="linea libre">
      <div class="l-top"><input class="l-nomin" value="${esc(l.nombre)}" oninput="onLibre(${i},'nombre',this.value)" placeholder="Concepto (Puerta, Lámpara, Mano de obra…)"><button class="l-del" onclick="delLinea(${i})">×</button></div>
      <div class="l-in">
        <input class="l-cant" type="number" inputmode="decimal" step="0.01" value="${l.cantidad||''}" oninput="onCant(${i},this.value)" placeholder="cant.">
        <input class="l-unid" type="text" value="${esc(l.unidad)}" oninput="onLibre(${i},'unidad',this.value)" placeholder="ud">
        <span class="l-x">×</span>
        <input class="l-precio" type="number" inputmode="decimal" step="0.01" value="${l.precioVenta||''}" oninput="onLibre(${i},'precioVenta',this.value)" placeholder="precio">
        <span class="l-calc">= <b id="lt-${i}">${eur((l.cantidad||0)*l.precioVenta)}</b></span>
      </div>
      ${quick?`<div class="l-quick">${quick}</div>`:''}
    </div>`;
    return `<div class="linea">
      <div class="l-top"><span class="l-nom">${esc(l.nombre)}</span><button class="l-del" onclick="delLinea(${i})">×</button></div>
      <div class="l-in">
        <input class="l-cant" type="number" inputmode="decimal" step="0.01" value="${l.cantidad||''}" oninput="onCant(${i},this.value)">
        <span class="l-u">${esc(l.unidad)} × ${eur(l.precioVenta)}</span>
        <span class="l-calc">= <b id="lt-${i}">${eur((l.cantidad||0)*l.precioVenta)}</b></span>
      </div>
      ${quick?`<div class="l-quick">${quick}</div>`:''}
    </div>`;}).join('');
  recompute();
}
function onCant(i,v){pres.lineas[i].cantidad=parseFloat(String(v).replace(',','.'))||0;document.getElementById('lt-'+i).textContent=eur(pres.lineas[i].cantidad*pres.lineas[i].precioVenta);recompute();}
function onLibre(i,campo,v){const l=pres.lineas[i];
  if(campo==='precioVenta'){l.precioVenta=parseFloat(String(v).replace(',','.'))||0;const lt=document.getElementById('lt-'+i);if(lt)lt.textContent=eur((l.cantidad||0)*l.precioVenta);recompute();}
  else l[campo]=v;
}
function onSecNom(i,v){pres.lineas[i].nombre=v;}
function quickFill(i,v){pres.lineas[i].cantidad=Math.round(v*100)/100;renderLineas();}
function delLinea(i){pres.lineas.splice(i,1);renderLineas();}
function addSeccion(){pres.lineas.push({tipo:'seccion',nombre:''});renderLineas();const ns=document.querySelectorAll('.s-nom');if(ns.length)ns[ns.length-1].focus();}
function addLibre(){pres.lineas.push({tipo:'libre',partidaId:null,nombre:'',unidad:'ud',cantidad:0,precioVenta:0,coste:0});renderLineas();const ns=document.querySelectorAll('.l-nomin');if(ns.length)ns[ns.length-1].focus();}
function recompute(){
  let venta=0,coste=0;pres.lineas.forEach(l=>{if(tipoDe(l)==='seccion')return;venta+=(l.cantidad||0)*(l.precioVenta||0);coste+=(l.cantidad||0)*(l.coste||0);});
  pres.lineas.forEach((l,i)=>{if(tipoDe(l)==='seccion'){const el=document.getElementById('ss-'+i);if(el)el.textContent=eur(subtotalDesde(i));}});
  document.getElementById('t-venta').textContent=eur(venta);
  document.getElementById('t-coste').textContent=eur(coste);
  const mg=venta>0?Math.round((venta-coste)/venta*100):0;
  const el=document.getElementById('t-margen');el.textContent=mg+'%';el.style.color=mg>=25?'var(--green)':mg>=10?'var(--amber)':'var(--red)';
}
async function guardar(){if(!pres)return;
  try{await api('PUT','/api/presupuestos/'+pres._id,{nombre:document.getElementById('d-nombre').value.trim(),clientName:document.getElementById('d-cliente').value.trim(),lineas:pres.lineas});toast('Guardado','ok');}
  catch(e){toast(e.message,'error');}}
async function eliminarPres(){if(!pres)return;if(!confirm('¿Eliminar este presupuesto?'))return;try{await api('DELETE','/api/presupuestos/'+pres._id);volver();toast('Eliminado','ok');}catch(e){toast(e.message,'error');}}

// ── PICKER PARTIDA ──
function abrirPicker(){document.getElementById('pk-search').value='';renderPick();abrir('ov-pick');}
function renderPick(){
  const q=(document.getElementById('pk-search').value||'').toLowerCase();
  const list=catalogo.filter(p=>!q||[p.nombre,p.capitulo].some(x=>String(x||'').toLowerCase().includes(q)));
  const box=document.getElementById('pk-list');
  if(!catalogo.length){box.innerHTML='<div class="empty" style="padding:20px">No hay partidas. Créalas en Catálogo de precios.</div>';return;}
  if(!list.length){box.innerHTML='<div class="empty" style="padding:20px">Sin coincidencias.</div>';return;}
  box.innerHTML=list.map(p=>`<div class="pick" onclick="addPartida('${p._id}')">
    <div><strong style="font-size:14px">${esc(p.nombre)}</strong><div style="font-size:11px;color:var(--text3)">${esc(p.capitulo||'')}${p.capitulo?' · ':''}${esc(p.unidad)}</div></div>
    <div style="font-weight:700;white-space:nowrap">${eur(p.precioVenta)}/${esc(p.unidad)}</div></div>`).join('');
}
function addPartida(pid){
  const p=catalogo.find(x=>String(x._id)===String(pid));if(!p)return;
  pres.lineas.push({tipo:'partida',partidaId:String(p._id),nombre:p.nombre,unidad:p.unidad,cantidad:0,precioVenta:p.precioVenta,coste:p.coste||0});
  cerrar('ov-pick');renderLineas();
  // hacer scroll a la última y foco en su cantidad
  const cants=document.querySelectorAll('.l-cant');if(cants.length)cants[cants.length-1].focus();
}

document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show');}));
(async function(){await loadWorkers();const ok=await tryRestore();if(!ok)showPage('login');})();
</script>
