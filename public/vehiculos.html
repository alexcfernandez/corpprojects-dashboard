<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vehículos — Corp Projects</title><link rel="stylesheet" href="/tool-theme.css">
<meta name="theme-color" content="#4d9cf8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0c0e12;--bg2:#13161c;--bg3:#1a1e27;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.15);--text:#f0f2f7;--text2:#8b92a8;--text3:#5a6278;--green:#22c487;--red:#f05252;--blue:#4d9cf8;--amber:#f59e0b}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;min-height:100vh}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:1000}
.logo{width:32px;height:32px;background:linear-gradient(135deg,#4d9cf8,#22c487);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.hbtn{margin-left:auto;background:none;border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:6px 12px;font-size:13px;text-decoration:none;white-space:nowrap}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:20px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
select,input,textarea,.btn{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;color:var(--text);padding:9px 12px;font:inherit;font-size:14px;text-decoration:none}
.btn{cursor:pointer;display:inline-block}.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}.btn.peq{padding:6px 10px;font-size:13px}.btn.roja{color:var(--red)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.vc{cursor:pointer}.vc:hover{border-color:var(--border2)}
.top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.top .n{flex:1;min-width:180px}.top .n b{font-size:16px}.top .n .s{font-size:12.5px;color:var(--text3);margin-top:2px}
.top .t{text-align:right}.top .t b{font-size:18px;font-variant-numeric:tabular-nums}.top .t div{font-size:12px;color:var(--text3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;border:1px solid var(--border2);border-radius:20px;padding:3px 9px;color:var(--text2);white-space:nowrap}
.chip.ok{border-color:rgba(34,196,135,.4);color:var(--green)}.chip.am{border-color:rgba(245,158,11,.5);color:var(--amber)}.chip.ro{border-color:rgba(240,82,82,.5);color:var(--red)}.chip.gr{color:var(--text3)}
.vacio{padding:30px;text-align:center;color:var(--text3);line-height:1.6}
h3{font-size:14px;margin:18px 0 8px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.grid label{display:block;font-size:12px;color:var(--text3);margin-bottom:4px}.grid input,.grid select{width:100%}
textarea{width:100%;min-height:60px}
.cat{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:6px}
.cat .l{width:150px;color:var(--text2);flex-shrink:0}.cat .b{flex:1;height:8px;background:var(--bg3);border-radius:5px;overflow:hidden}.cat .b i{display:block;height:100%;background:var(--blue)}
.cat .v{width:90px;text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
td{padding:6px;border-bottom:1px solid var(--border);vertical-align:top}td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{font-size:11px;border:1px solid var(--border2);border-radius:20px;padding:1px 7px;color:var(--text3);white-space:nowrap}
details summary{cursor:pointer;font-size:13.5px;font-weight:600;margin-top:10px}
.doc{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}.doc .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.falta{color:var(--amber);font-size:13px;margin-top:6px}
#mapa{height:440px;border-radius:14px;border:1px solid var(--border);margin-bottom:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border2);padding:10px 16px;border-radius:10px;z-index:2000;display:none;max-width:90vw}
.nota{font-size:12px;color:var(--text3);line-height:1.6;margin-top:8px}
@media(max-width:600px){.cat .l{width:110px}#mapa{height:360px}}
</style><link rel="stylesheet" href="/cp-ui.css">
<script src="/nav.js" defer></script>
</head>
<body><script>try{if(localStorage.getItem("cp_theme")==="light")document.body.classList.add("light");}catch(e){}</script>
<div class="header"><div class="logo">CP</div><div><div style="font-weight:700">Vehículos</div><div style="font-size:12px;color:var(--text2)">Flota, vencimientos, documentos y lo que cuesta cada uno</div></div><a class="hbtn" href="/">← Dashboard</a></div>
<div class="wrap">
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="flota" onclick="verTab('flota')">🚐 Flota</button>
    <button class="tab" data-t="mapa" onclick="verTab('mapa')">📍 Mapa</button>
    <button class="tab" data-t="gastos" onclick="verTab('gastos')">💶 Gastos</button>
    <button class="tab" data-t="bajas" onclick="verTab('bajas')">Dados de baja</button>
  </div>
  <div id="v-flota"></div>
  <div id="v-mapa" style="display:none"></div>
  <div id="v-gastos" style="display:none"></div>
  <div id="v-bajas" style="display:none"></div>
  <div id="v-ficha" style="display:none"></div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const tok=localStorage.getItem('cp_token');const H={'Authorization':'Bearer '+tok};
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=v=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(v||0);
const fmtF=f=>f?String(f).slice(0,10).split('-').reverse().join('/'):'';
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const anioAct=new Date().getFullYear();
let F=null,workers=[],tabAct='flota',cur=null,mapa=null;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display='none',3200);}
async function api(m,u,b){const o={method:m,headers:{...H}};if(b instanceof FormData)o.body=b;else if(b){o.headers['Content-Type']='application/json';o.body=JSON.stringify(b);}const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'HTTP '+r.status);return d;}

// Semáforo de una fecha de vencimiento.
function chip(titulo,dias,fecha){
  if(dias==null)return `<span class="chip gr">${titulo}: sin fecha</span>`;
  const c=dias<0?'ro':dias<=30?'am':'ok';
  const t=dias<0?`vencida hace ${-dias} d`:dias===0?'vence HOY':dias<=60?`en ${dias} d`:fmtF(fecha);
  return `<span class="chip ${c}">${titulo}: ${t}</span>`;
}

function verTab(t){
  tabAct=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ['flota','mapa','gastos','bajas','ficha'].forEach(x=>document.getElementById('v-'+x).style.display=x===t?'':'none');
  if(t==='flota'||t==='bajas')cargarFlota();
  if(t==='mapa')cargarMapa();
  if(t==='gastos')cargarGastos();
  if(t!=='ficha'&&location.hash)history.replaceState(null,'',location.pathname);
}

// ── FLOTA ──
async function cargarFlota(){
  const el=document.getElementById(tabAct==='bajas'?'v-bajas':'v-flota');
  if(!tok){el.innerHTML='<div class="vacio">Abre esta página desde el dashboard.</div>';return;}
  try{F=await api('GET','/api/vehiculos/flota');}catch(e){el.innerHTML='<div class="vacio" style="color:var(--red)">'+esc(e.message)+'</div>';return;}
  const bajas=tabAct==='bajas';
  const l=F.vehiculos.filter(v=>bajas?v.estado==='baja':v.estado==='activo');
  const avisos=bajas?[]:l.filter(v=>['itv','seguro','revision'].some(k=>v.dias[k]!=null&&v.dias[k]<=30));
  el.innerHTML=(bajas?'':`<div class="bar"><button class="btn pri" onclick="nuevo()">+ Nuevo vehículo</button><span style="font-size:13px;color:var(--text2)">${l.length} en la flota · gasto ${F.anio}: <b style="color:var(--text)">${eur(l.reduce((a,v)=>a+v.gastoAnio,0))}</b></span></div>`)
   +(bajas?'':'<div id="repost"></div>')
   +(avisos.length?`<div class="card" style="border-color:rgba(245,158,11,.4)"><b style="color:var(--amber)">⚠️ Vencimientos próximos</b><div class="nota" style="color:var(--text2)">${avisos.length} vehículo${avisos.length>1?'s':''} con ITV, seguro o revisión en menos de 30 días. Se avisa por WhatsApp al conductor (ITV y revisión) y a la oficina a los 30, 15, 7, 1 y 0 días.</div></div>`:'')
   +(l.length?l.map(v=>{
      const docs=v.docsTipos||{};const faltan=['ficha_tecnica','permiso','seguro'].filter(t=>!docs[t]).map(t=>F.docs[t]);
      return `<div class="card vc" onclick="abrir('${v.id}')"><div class="top"><div class="n"><b>🚐 ${esc(v.nombre)}</b><div class="s">${esc([v.matricula,[v.marca,v.modelo].filter(Boolean).join(' '),F.tipos[v.tipo]].filter(Boolean).join(' · '))}</div><div class="s" style="color:var(--text2)">${v.conductor?'👤 Lo lleva '+esc(v.conductor.name):'Sin conductor asignado'}</div></div>
        <div class="t"><b>${eur(v.gastoAnio)}</b><div>gasto ${F.anio}</div>${bajas&&v.baja?`<div>${esc(F.motivosBaja[v.baja.motivo]||'')} ${fmtF(v.baja.fecha)}${v.baja.precioVenta?' · '+eur(v.baja.precioVenta):''}</div>`:''}</div></div>
        ${bajas?'':`<div class="chips">${chip('ITV',v.dias.itv,v.itv&&v.itv.proxima)}${chip('Seguro',v.dias.seguro,v.seguro&&v.seguro.vencimiento)}${v.revision&&v.revision.proximaFecha?chip('Revisión',v.dias.revision,v.revision.proximaFecha):''}${v.quartixId?'<span class="chip ok">GPS</span>':''}</div>
        ${faltan.length?`<div class="falta">Falta subir: ${faltan.join(', ')}</div>`:''}`}</div>`;}).join('')
     :`<div class="vacio">${bajas?'No hay vehículos dados de baja.':'Aún no hay vehículos. Pulsa «+ Nuevo vehículo» y da de alta cada furgoneta y coche con su matrícula.'}</div>`);
  if(!bajas)cargarRepostajes(l);
}
// ── REPOSTAJES (correo de Esclat en cada repostaje + capturas de su app) ──
let _repHash=(/^#repostaje=([0-9a-f]{24})$/.exec(location.hash)||[])[1]||null;
async function cargarRepostajes(vs){const el=document.getElementById('repost');if(!el)return;let p=[];try{p=await api('GET','/api/vehiculos/repostajes/pendientes');}catch(e){}
  const hm=v=>v?String(v).slice(0,5):'';
  el.innerHTML=`<div class="card" ${p.length?'style="border-color:rgba(77,156,248,.45)"':''}><b>⛽ Repostajes ${p.length?`por asignar (${p.length})`:''}</b>
    <div class="nota" style="color:var(--text2)">Cada repostaje con la app de Esclat manda un correo con el importe y la hora; el programa te pregunta de qué vehículo es y luego le pide los km a quien lo lleva. Con eso, la factura de Esclat se reparte sola por vehículo en Compras.</div>
    ${p.map(r=>`<div class="rp" id="rp-${r.id}" style="border-top:1px solid var(--border);padding:8px 0;margin-top:6px${r.id===_repHash?';background:rgba(77,156,248,.12);border-radius:8px;padding:8px':''}"><div><b>${eur(r.importe)}</b> · ${fmtF(r.fecha)} ${hm(r.hora)} · <span style="color:var(--text3)">${esc(r.establecimiento||r.alias||'')}${r.alias&&r.establecimiento?' · app: «'+esc(r.alias)+'»':''}</span></div>
      <div class="chips">${vs.map(v=>`<button class="chip" style="cursor:pointer" onclick="asignarRep('${r.id}','${v.id}',this)">${esc(v.nombre)}</button>`).join('')}</div></div>`).join('')||'<div style="color:var(--text3);font-size:13.5px;margin-top:6px">Ninguno pendiente.</div>'}
    <div class="bar" style="margin:10px 0 0"><label class="btn peq" style="cursor:pointer">📱 Capturas de la app Esclat<input type="file" accept="image/*,application/pdf" multiple style="display:none" onchange="subirCapturas(this)"></label><button class="btn peq" onclick="recuperarCorreos(this)">📧 Traer los correos desde septiembre</button></div></div>`;
  if(_repHash){const x=document.getElementById('rp-'+_repHash);if(x)x.scrollIntoView({block:'center'});_repHash=null;history.replaceState(null,'',location.pathname);}}
async function asignarRep(id,vid,b){b.disabled=true;try{const r=await api('POST','/api/vehiculos/repostajes/'+id+'/asignar',{vehiculoId:vid});toast(`✅ ${r.vehiculo}`+(r.pedidoKm?` · le pedimos los km a ${r.conductor}`:r.conductor?'':' (sin conductor: no se piden km)'));const x=document.getElementById('rp-'+id);if(x)x.remove();}catch(e){toast(e.message);b.disabled=false;}}
async function subirCapturas(inp){const fs=[...inp.files];if(!fs.length)return;const fd=new FormData();fs.forEach(f=>fd.append('capturas',f));toast('🤖 Leyendo las capturas… (10-30 s)');
  try{const d=await api('POST','/api/vehiculos/repostajes/capturas',fd);toast(`📱 ${d.leidos} tiquet(s) leídos${d.sinVehiculo.length?' · no sé cuál es: '+d.sinVehiculo.join(', ')+' (pon ese nombre en su ficha)':''}`);cargarFlota();}
  catch(e){toast(e.message);}finally{inp.value='';}}
async function recuperarCorreos(b){const t=b.textContent;b.disabled=true;b.textContent='Buscando en el correo…';try{const d=await api('POST','/api/vehiculos/repostajes/recuperar-correo',{desde:'2026-09-01'});toast(`📧 ${d.correos} correos de repostaje · ${d.nuevos} nuevos`);cargarFlota();}catch(e){toast(e.message);}finally{b.disabled=false;b.textContent=t;}}

async function nuevo(){
  const nombre=await CPDialog.pedir('Nombre del vehículo',{placeholder:'p. ej. Furgoneta Jose o Berlingo blanca'});if(nombre===null)return;
  const matricula=(await CPDialog.pedir('Matrícula',{placeholder:'1234ABC'}))||'';
  try{const v=await api('POST','/api/vehiculos',{nombre,matricula});toast('Vehículo creado. Completa su ficha.');abrir(String(v._id));}catch(e){toast(e.message);}
}

// ── FICHA ──
async function abrir(id){
  verTab('ficha');history.replaceState(null,'',location.pathname+'#'+id);
  const el=document.getElementById('v-ficha');el.innerHTML='<div class="vacio">Cargando…</div>';
  if(!workers.length){try{workers=await (await fetch('/api/partes/workers')).json();}catch(e){workers=[];}}
  try{cur=await api('GET','/api/vehiculos/'+id);}catch(e){el.innerHTML='<div class="vacio" style="color:var(--red)">'+esc(e.message)+'</div>';return;}
  pintarFicha();cargarKm(id);cargarCoste(id);
}
// Lo que cuesta: compra + gastos − venta, por año y de media al año (para ver si sale a cuenta o mejor un renting).
async function cargarCoste(id){const el=document.getElementById('coste-blq');if(!el)return;let d;try{d=await api('GET','/api/vehiculos/'+id+'/coste');}catch(e){el.innerHTML='<div style="color:var(--red)">'+esc(e.message)+'</div>';return;}
  const cats=[...new Set(d.porAnio.flatMap(a=>Object.keys(a.porCategoria)))];
  el.innerHTML=`<div style="display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin-bottom:8px"><span>Desde ${fmtF(d.desde)} (${d.anos} años)</span><span>Total <b>${eur(d.total)}</b></span><span>Al año <b>${eur(d.alAnio)}</b> (${eur(d.alMes)}/mes)</span><span style="color:var(--text3)">Solo uso, sin la compra: ${eur(d.usoAlAnio)}/año</span></div>
    ${!d.precioCompra&&d.formaCompra==='compra'?'<div style="font-size:12.5px;color:var(--amber);margin-bottom:6px">Falta el precio de compra (tarjeta «Compra» de la ficha) para que el coste sea completo.</div>':''}
    <div style="overflow:auto"><table style="width:100%;font-size:13px;border-collapse:collapse"><tr style="color:var(--text3)"><th style="text-align:left;padding:4px">Año</th>${cats.map(c=>`<th style="text-align:right;padding:4px">${esc(d.categorias[c]||c)}</th>`).join('')}<th style="text-align:right;padding:4px">Total</th></tr>
    ${d.porAnio.map(a=>`<tr style="border-top:1px solid var(--border)"><td style="padding:4px">${a.anio}</td>${cats.map(c=>`<td style="text-align:right;padding:4px">${a.porCategoria[c]?eur(a.porCategoria[c]):'—'}</td>`).join('')}<td style="text-align:right;padding:4px"><b>${eur(a.total)}</b></td></tr>`).join('')}</table></div>
    <div style="font-size:12px;color:var(--text3);margin-top:6px">Compra (o cuotas) + taller, neumáticos, seguro, combustible, ITV… − venta. Compáralo con lo que costaría un renting al año.</div>`;}
async function cargarKm(id){const el=document.getElementById('km-blq');if(!el)return;let d;try{d=await api('GET','/api/vehiculos/'+id+'/km');}catch(e){el.innerHTML='<div style="color:var(--red)">'+esc(e.message)+'</div>';return;}
  const v=cur.vehiculo,n=x=>Number(x).toLocaleString('es-ES');
  el.innerHTML=(d.km?`<div class="chips" style="margin-top:0"><span class="chip">${n(d.km)} km del ${fmtF(d.desde)} al ${fmtF(d.hasta)}</span><span class="chip ok">${String(d.eurKm.toFixed(2)).replace('.',',')} €/km</span>${d.l100?`<span class="chip">${String(d.l100).replace('.',',')} L/100 km</span>`:''}<span class="chip">gasto ${eur(d.gasto)} (combustible ${eur(d.combustible)})</span></div>`
      :`<div class="nota" style="margin-top:0">Con dos lecturas de km sale lo que cuesta por km. Las apunta quien lo lleva desde su app al repostar y una vez a la semana.</div>`)
   +`<div class="bar" style="margin:10px 0 0"><input id="km-n" type="number" inputmode="numeric" placeholder="km que marca${v.km?' (último '+n(v.km)+')':''}" style="max-width:220px"><button class="btn" onclick="apuntarKm()">Apuntar km</button></div>`
   +(d.lecturas.length?`<details><summary>Lecturas de km (${d.lecturas.length})</summary><table>${d.lecturas.map(l=>`<tr><td style="color:var(--text3)">${fmtF(l.fecha)}</td><td class="r">${n(l.km)} km</td><td style="color:var(--text3)">${esc(l.por||l.origen||'')}</td></tr>`).join('')}</table></details>`:'')
   +(d.repostajes.length?`<details><summary>Repostajes (${d.repostajes.length})</summary><table>${d.repostajes.map(r=>`<tr><td style="color:var(--text3);white-space:nowrap">${fmtF(r.fecha)} ${r.hora||''}</td><td>${esc(r.quien||r.alias||({esclat_email:'correo Esclat',esclat_app:'app Esclat',factura:'factura'})[r.origen]||'')}${r.ticket?' · <span style="color:var(--text3)">'+esc(r.ticket)+'</span>':''}</td><td class="r">${r.litros?String(r.litros).replace('.',',')+' L':''}</td><td class="r">${r.importe!=null?eur(r.importe)+(r.conIva?' <span style="color:var(--text3);font-size:11px">IVA incl.</span>':''):''}</td><td class="r">${r.km?n(r.km)+' km':''}</td><td>${r.enFactura?'✓':''}</td></tr>`).join('')}</table></details>`:'');}
async function apuntarKm(){const k=V('km-n');if(!k)return;try{await api('POST','/api/vehiculos/'+cur.vehiculo.id+'/km',{km:k});toast('✅ Km apuntados');cargarKm(cur.vehiculo.id);}catch(e){toast(e.message);}}
function sel(id,opts,val,vacio){return `<select id="${id}">${vacio!=null?`<option value="">${vacio}</option>`:''}${Object.entries(opts).map(([k,t])=>`<option value="${esc(k)}" ${String(val||'')===k?'selected':''}>${esc(t)}</option>`).join('')}</select>`;}
function inp(id,val,tipo='text',ph=''){return `<input id="${id}" type="${tipo}" value="${esc(val==null?'':val)}" placeholder="${esc(ph)}" ${tipo==='number'?'step="any" inputmode="decimal"':''}>`;}
function campo(lbl,html){return `<div><label>${lbl}</label>${html}</div>`;}
function pintarFicha(){
  const {vehiculo:v,documentos:docs,gastos:g}=cur;const it=v.itv||{},se=v.seguro||{},rv=v.revision||{};
  const comb={};(cur.combustibles||[]).forEach(c=>comb[c]=c);
  const baja=v.estado==='baja';
  const tieneDoc=t=>docs.some(d=>d.tipo===t);
  document.getElementById('v-ficha').innerHTML=`
  <div class="bar"><button class="btn peq" onclick="verTab('flota')">← Flota</button><b style="font-size:18px">🚐 ${esc(v.nombre)}</b><span class="tag">${esc(v.codigo||'')}</span>${baja?'<span class="chip ro">Dado de baja</span>':''}</div>
  <div class="card"><div class="chips" style="margin-top:0">${chip('ITV',v.dias.itv,it.proxima)}${chip('Seguro',v.dias.seguro,se.vencimiento)}${rv.proximaFecha?chip('Revisión',v.dias.revision,rv.proximaFecha):''}<span class="chip">${v.conductor?'👤 '+esc(v.conductor.name):'Sin conductor'}</span>${g?`<span class="chip">Gasto ${anioAct}: ${eur(g.total)}</span>`:''}</div></div>

  <h3>Quién lo lleva</h3>
  <div class="card"><div class="bar" style="margin:0"><select id="c-user"><option value="">— Nadie (en la nave) —</option>${workers.map(w=>`<option value="${esc(w.id)}" ${v.conductor&&v.conductor.userId===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select><input id="c-fecha" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="btn" onclick="cambiarConductor()">Cambiar</button></div>
   ${(v.historialConductor||[]).length?`<table>${v.historialConductor.slice().reverse().map(h=>`<tr><td>${esc(h.name)}</td><td style="color:var(--text3)">${fmtF(h.desde)} → ${h.hasta?fmtF(h.hasta):'ahora'}</td></tr>`).join('')}</table>`:''}
   <div class="nota">El conductor recibe por WhatsApp los avisos de ITV y revisión de su vehículo.</div></div>

  <h3>Datos</h3>
  <div class="card"><div class="grid">
    ${campo('Nombre',inp('f-nombre',v.nombre))}${campo('Matrícula',inp('f-matricula',v.matricula))}${campo('Tipo',sel('f-tipo',cur.tipos,v.tipo))}
    ${campo('Marca',inp('f-marca',v.marca))}${campo('Modelo',inp('f-modelo',v.modelo))}${campo('Combustible',sel('f-combustible',comb,v.combustible,'—'))}
    ${campo('Nº de bastidor',inp('f-bastidor',v.bastidor))}${campo('Fecha de matriculación',inp('f-fechaMatriculacion',v.fechaMatriculacion,'date'))}${campo('Km actuales',inp('f-km',v.km,'number'))}
    ${campo('Impuesto circulación (€/año)',inp('f-ivtm',v.ivtm,'number'))}${campo('Id en Quartix (GPS)',inp('f-quartixId',v.quartixId,'text','se enlaza solo por matrícula'))}${campo('Nombre en la app Esclat',inp('f-aliasEsclat',(v.aliasEsclat||[]).join(', '),'text','p. ej. Citroën berlingo'))}
  </div></div>

  <h3>ITV</h3>
  <div class="card"><div class="grid">${campo('Próxima ITV',inp('f-itv-proxima',it.proxima,'date'))}${campo('Última ITV',inp('f-itv-ultima',it.ultima,'date'))}${campo('Notas',inp('f-itv-notas',it.notas))}</div></div>

  <h3>Seguro</h3>
  <div class="card"><div class="grid">${campo('Compañía',inp('f-se-compania',se.compania))}${campo('Nº de póliza',inp('f-se-poliza',se.poliza))}${campo('Modalidad',inp('f-se-modalidad',se.modalidad,'text','todo riesgo, terceros…'))}
    ${campo('Precio anual (€)',inp('f-se-precioAnual',se.precioAnual,'number'))}${campo('Vencimiento',inp('f-se-vencimiento',se.vencimiento,'date'))}${campo('Tel. asistencia',inp('f-se-telefonoAsistencia',se.telefonoAsistencia,'tel'))}</div></div>

  <h3>Mantenimiento</h3>
  <div class="card"><div class="grid">${campo('Próxima revisión (fecha)',inp('f-rv-proximaFecha',rv.proximaFecha,'date'))}${campo('Próxima revisión (km)',inp('f-rv-proximaKm',rv.proximaKm,'number'))}${campo('Notas',inp('f-rv-notas',rv.notas,'text','aceite, filtros, correa…'))}</div></div>

  <h3>Compra</h3>
  <div class="card"><div class="grid">${campo('Forma',sel('f-formaCompra',cur.formas,v.formaCompra))}${campo('Fecha de alta',inp('f-fechaAlta',v.fechaAlta,'date'))}${campo('Precio de compra (€)',inp('f-precioCompra',v.precioCompra,'number'))}
    ${campo('Cuota mensual (renting/préstamo)',inp('f-cuotaMensual',v.cuotaMensual,'number'))}${campo('Fin del contrato',inp('f-finContrato',v.finContrato,'date'))}${campo('Vendedor / financiera',inp('f-proveedorCompra',v.proveedorCompra))}</div>
    <div style="margin-top:10px"><label style="font-size:12px;color:var(--text3)">Notas</label><textarea id="f-notas">${esc(v.notas||'')}</textarea></div></div>
  <div class="bar" style="position:sticky;bottom:0;background:var(--bg);padding:10px 0;margin:0"><button class="btn pri" onclick="guardar()">Guardar ficha</button></div>

  <h3>Documentación</h3>
  <div class="card">
    ${['ficha_tecnica','permiso','seguro'].filter(t=>!tieneDoc(t)).length?`<div class="falta" style="margin:0 0 8px">Falta: ${['ficha_tecnica','permiso','seguro'].filter(t=>!tieneDoc(t)).map(t=>cur.docsTipos[t]).join(', ')}</div>`:''}
    ${docs.map(d=>`<div class="doc"><span>${/pdf/.test(d.mime)?'📄':'🖼️'}</span><span class="nm"><b>${esc(cur.docsTipos[d.tipo]||d.tipo)}</b> · ${esc(d.nombre)} <span style="color:var(--text3);font-size:12px">${fmtF(d.subido)}</span></span><button class="btn peq" onclick="verDoc('${d.id}')">Ver</button><button class="btn peq roja" onclick="borrarDoc('${d.id}')">✕</button></div>`).join('')||'<div style="color:var(--text3);font-size:14px">Sin documentos.</div>'}
    <div class="bar" style="margin:12px 0 0">${sel('d-tipo',cur.docsTipos,'ficha_tecnica')}<input type="file" id="d-file" accept="image/*,application/pdf"><button class="btn" onclick="subirDoc()">Subir</button></div>
    <div class="nota">Foto o PDF. Se guardan en la ficha para tenerlos a mano si piden la documentación o hay un parte.</div>
  </div>

  <h3>Kilómetros y combustible</h3>
  <div class="card" id="km-blq"><div style="color:var(--text3);font-size:14px">Cargando…</div></div>

  <h3>Lo que cuesta</h3>
  <div class="card" id="coste-blq"><div style="color:var(--text3);font-size:14px">Cargando…</div></div>

  <h3>Gastos ${anioAct}</h3>
  <div class="card">${g&&g.gastos.length?bloqueGastos(g,cur.categorias,false):'<div style="color:var(--text3);font-size:14px">Sin gastos este año. En Compras, destino «🚐 Un vehículo»; en el cierre del trimestre, «🚐 Vehículo».</div>'}</div>

  <h3>${baja?'Baja':'Dar de baja'}</h3>
  <div class="card">${baja?`<div>${esc(cur.motivosBaja[v.baja.motivo]||'')} el ${fmtF(v.baja.fecha)}${v.baja.precioVenta?' por '+eur(v.baja.precioVenta):''}${v.baja.nota?' — '+esc(v.baja.nota):''}</div><button class="btn" style="margin-top:10px" onclick="reactivar()">Volver a darlo de alta</button>`
   :`<div class="grid">${campo('Motivo',sel('b-motivo',cur.motivosBaja,'vendido'))}${campo('Fecha',inp('b-fecha',new Date().toISOString().slice(0,10),'date'))}${campo('Precio de venta (€)',inp('b-precio','','number'))}${campo('Nota',inp('b-nota',''))}</div><button class="btn roja" style="margin-top:10px" onclick="darBaja()">Dar de baja</button><div class="nota">Deja de salir en la flota y en los avisos, pero se conservan su ficha, documentos y gastos.</div>`}</div>`;
}
const V=id=>{const e=document.getElementById(id);return e?e.value:undefined;};
async function guardar(){
  const b={};['nombre','matricula','tipo','marca','modelo','combustible','bastidor','fechaMatriculacion','km','ivtm','quartixId','formaCompra','fechaAlta','precioCompra','cuotaMensual','finContrato','proveedorCompra','notas','aliasEsclat'].forEach(k=>b[k]=V('f-'+k));
  b.itv={proxima:V('f-itv-proxima'),ultima:V('f-itv-ultima'),notas:V('f-itv-notas')};
  b.seguro={};['compania','poliza','modalidad','precioAnual','vencimiento','telefonoAsistencia'].forEach(k=>b.seguro[k]=V('f-se-'+k));
  b.revision={proximaFecha:V('f-rv-proximaFecha'),proximaKm:V('f-rv-proximaKm'),notas:V('f-rv-notas')};
  try{await api('PUT','/api/vehiculos/'+cur.vehiculo.id,b);toast('Ficha guardada');abrir(cur.vehiculo.id);}catch(e){toast(e.message);}
}
async function cambiarConductor(){
  const s=document.getElementById('c-user');const userId=s.value;const name=userId?s.options[s.selectedIndex].text:'';
  try{await api('POST','/api/vehiculos/'+cur.vehiculo.id+'/conductor',{userId,name,fecha:V('c-fecha')});toast(userId?'Ahora lo lleva '+name:'Vehículo en la nave');abrir(cur.vehiculo.id);}catch(e){toast(e.message);}
}
async function subirDoc(){
  const f=document.getElementById('d-file').files[0];if(!f){toast('Elige una foto o un PDF');return;}
  const fd=new FormData();fd.append('archivo',f);fd.append('tipo',V('d-tipo'));
  try{await api('POST','/api/vehiculos/'+cur.vehiculo.id+'/docs',fd);toast('Documento subido');abrir(cur.vehiculo.id);}catch(e){toast(e.message);}
}
async function verDoc(id){
  const w=window.open('','_blank');
  try{const r=await fetch('/api/vehiculos/docs/'+id,{headers:H});if(!r.ok)throw new Error('HTTP '+r.status);const u=URL.createObjectURL(await r.blob());if(w)w.location=u;else location.href=u;}catch(e){if(w)w.close();toast(e.message);}
}
async function borrarDoc(id){if(!(await CPDialog.confirmar('¿Borrar este documento?',{ok:'Borrar',peligro:true})))return;try{await api('DELETE','/api/vehiculos/docs/'+id);abrir(cur.vehiculo.id);}catch(e){toast(e.message);}}
async function darBaja(){
  if(!(await CPDialog.confirmar('¿Dar de baja '+cur.vehiculo.nombre+'?',{ok:'Dar de baja',peligro:true})))return;
  try{await api('POST','/api/vehiculos/'+cur.vehiculo.id+'/baja',{motivo:V('b-motivo'),fecha:V('b-fecha'),precioVenta:V('b-precio'),nota:V('b-nota')});toast('Dado de baja');abrir(cur.vehiculo.id);}catch(e){toast(e.message);}
}
async function reactivar(){try{await api('POST','/api/vehiculos/'+cur.vehiculo.id+'/reactivar');abrir(cur.vehiculo.id);}catch(e){toast(e.message);}}

// ── GASTOS ──
function bloqueGastos(v,cats,abierto){
  const cs=Object.entries(v.porCategoria).sort((a,b)=>b[1]-a[1]);const max=cs.length?cs[0][1]:1;
  const meses=Object.entries(v.porMes).sort((a,b)=>a[0].localeCompare(b[0]));
  return cs.map(([k,val])=>`<div class="cat"><span class="l">${esc(cats[k]||k)}</span><span class="b"><i style="width:${Math.round(val/max*100)}%"></i></span><span class="v">${eur(val)}</span></div>`).join('')
   +(meses.length?`<div class="chips">${meses.map(([m,val])=>`<span class="tag">${MES[Number(m.slice(5,7))-1]} ${eur(val)}</span>`).join('')}</div>`:'')
   +(v.gastos.length?`<details ${abierto?'open':''}><summary>Detalle (${v.gastos.length})</summary><table>${v.gastos.map(g=>`<tr><td style="white-space:nowrap;color:var(--text3)">${fmtF(g.fecha)}</td><td>${g.compraId?`<a href="/compras#${esc(g.compraId)}" target="_blank" style="color:var(--text)">${esc(g.concepto)}</a>`:esc(g.concepto)} <span class="tag">${esc(cats[g.categoria]||g.categoria)}</span>${g.conFactura?(g.porRevisar?' <span class="tag" style="color:var(--amber)">por revisar</span>':''):' <span class="tag" style="color:var(--amber)">sin factura</span>'}</td><td class="r">${eur(g.importe)}</td></tr>`).join('')}</table></details>`:'');
}
async function cargarGastos(){
  const el=document.getElementById('v-gastos');
  const a=(document.getElementById('g-anio')||{}).value||anioAct;
  el.innerHTML='<div class="vacio">Cargando…</div>';
  let d;try{d=await api('GET','/api/vehiculos/resumen?anio='+a);}catch(e){el.innerHTML='<div class="vacio" style="color:var(--red)">'+esc(e.message)+'</div>';return;}
  el.innerHTML=`<div class="bar"><select id="g-anio" onchange="cargarGastos()">${[0,1,2,3].map(i=>anioAct-i).map(y=>`<option ${String(y)===String(a)?'selected':''}>${y}</option>`).join('')}</select><span style="font-size:14px;color:var(--text2)">Total ${d.anio}: <b style="color:var(--text);font-size:18px">${eur(d.total)}</b></span></div>`
   +(d.vehiculos.length?d.vehiculos.map(v=>`<div class="card"><div class="top"><div class="n"><b style="cursor:pointer" onclick="abrir('${v.id}')">🚐 ${esc(v.nombre)}</b><div class="s">${esc(v.matricula)}${v.quien?' · lo lleva '+esc(v.quien):''}</div></div><div class="t"><b>${eur(v.total)}</b><div>${v.total?`media ${eur(v.mediaMes)}/mes`:'sin gastos'}${v.sinFactura?` · ${v.sinFactura} sin factura`:''}</div></div></div>${bloqueGastos(v,d.categorias,false)}</div>`).join(''):'<div class="vacio">Aún no hay vehículos.</div>')
   +'<div class="nota">Suman las facturas de Compras con destino «vehículo» (por su base, sin IVA) y los pagos marcados «🚐 Vehículo» en el cierre del trimestre (tickets sin factura, por su importe).</div>';
}

// ── MAPA (Quartix) ──
async function cargarMapa(){
  const el=document.getElementById('v-mapa');
  if(!mapa)el.innerHTML='<div class="vacio">Cargando posiciones…</div>';
  let d;try{d=await api('GET','/api/vehiculos/gps');}catch(e){el.innerHTML='<div class="vacio" style="color:var(--red)">No se pudo leer Quartix: '+esc(e.message)+'</div>';return;}
  if(!d.configurado){el.innerHTML=`<div class="card"><b>📍 Conectar los localizadores Quartix</b><div class="nota" style="color:var(--text2);font-size:14px">
    1. Pide a Quartix que activen el <b>acceso a la API</b> en vuestra cuenta y crea un usuario solo para esto.<br>
    2. Pon en Railway (variables del servicio) <code>QUARTIX_CUSTOMER_ID</code>, <code>QUARTIX_USER</code> y <code>QUARTIX_PASSWORD</code>.<br>
    3. Vuelve aquí: cada vehículo se enlaza solo por su matrícula (o pon su id de Quartix en la ficha).</div></div>`;mapa=null;return;}
  const con=d.puntos.filter(p=>p.posicion&&p.posicion.lat!=null);
  if(!mapa){el.innerHTML=`<div class="bar"><button class="btn peq" onclick="cargarMapa()">↻ Actualizar</button><span id="m-act" style="font-size:12px;color:var(--text3)"></span></div><div id="mapa"></div><div id="m-lista"></div>`;
    mapa=L.map('mapa').setView([41.98,2.82],9);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,referrerPolicy:'strict-origin-when-cross-origin',attribution:'© OpenStreetMap'}).addTo(mapa);mapa._capa=L.layerGroup().addTo(mapa);}
  setTimeout(()=>mapa.invalidateSize(),50);
  mapa._capa.clearLayers();
  const pts=[];
  con.forEach(p=>{const q=p.posicion;const ll=[q.lat,q.lon];pts.push(ll);
    L.circleMarker(ll,{radius:9,color:'#fff',weight:2,fillColor:q.encendido?'#22c487':'#4d9cf8',fillOpacity:1}).addTo(mapa._capa)
     .bindPopup(`<b>${esc(p.nombre)}</b> ${esc(p.matricula||'')}<br>${p.conductor?'👤 '+esc(p.conductor)+'<br>':''}${q.direccion?esc(q.direccion)+'<br>':''}${q.encendido?'En marcha'+(q.velocidad?' · '+q.velocidad+' km/h':''):'Parado'}${q.fecha?'<br><small>'+esc(String(q.fecha).replace('T',' ').slice(0,16))+'</small>':''}`)
     .bindTooltip(esc(p.nombre),{permanent:false});});
  if(pts.length)mapa.fitBounds(pts,{padding:[40,40],maxZoom:14});
  document.getElementById('m-act').textContent='Actualizado '+new Date(d.actualizado).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+' · verde = en marcha';
  const sin=d.puntos.filter(p=>!p.posicion);
  document.getElementById('m-lista').innerHTML=con.map(p=>`<div class="card" style="padding:10px 14px;cursor:pointer" onclick="mapa.setView([${p.posicion.lat},${p.posicion.lon}],15)"><b>${esc(p.nombre)}</b> <span style="color:var(--text3);font-size:13px">${esc(p.matricula||'')}${p.conductor?' · '+esc(p.conductor):''}</span><div style="font-size:13px;color:var(--text2)">${esc(p.posicion.direccion||'')} · ${p.posicion.encendido?'en marcha':'parado'}${p.posicion.km?' · '+p.posicion.km.toLocaleString('es-ES')+' km':''}</div></div>`).join('')
   +(sin.length?`<div class="nota">Sin localizador enlazado: ${sin.map(p=>esc(p.nombre)).join(', ')}.</div>`:'')
   +(d.sinVincular.length?`<div class="nota">En Quartix pero no en la flota (pon su id en la ficha del vehículo): ${d.sinVincular.map(p=>esc(p.registro||'?')+' (id '+esc(p.quartixId)+')').join(', ')}.</div>`:'');
}

if(/^#[0-9a-f]{24}$/.test(location.hash))abrir(location.hash.slice(1));else cargarFlota();
</script>
