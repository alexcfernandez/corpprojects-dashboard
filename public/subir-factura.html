<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Subir factura — Corp Projects</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/tool-theme.css">
<meta name="theme-color" content="#4d9cf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Corp Projects">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0e12;--bg2:#13161c;--bg3:#1a1e27;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.15);
  --text:#f0f2f7;--text2:#8b92a8;--text3:#5a6278;
  --green:#22c487;--red:#f05252;--blue:#4d9cf8;--amber:#f59e0b;--purple:#a78bfa;
  --r:12px;--rs:10px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;min-height:100vh}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#4d9cf8,#22c487);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.header-text{font-weight:600;font-size:15px}
.header-sub{font-size:12px;color:var(--text3);margin-top:1px}
.header-logout{margin-left:auto;background:none;border:1px solid var(--border2);border-radius:8px;color:var(--text3);padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.page{display:none;min-height:100vh}
.page.active{display:block}
.container{padding:20px;max-width:500px;margin:0 auto}

/* LOGIN */
.login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:28px 24px;margin-top:24px}
.login-title{font-size:18px;font-weight:600;margin-bottom:4px;text-align:center}
.login-sub{font-size:13px;color:var(--text3);text-align:center;margin-bottom:24px}
.worker-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.worker-btn{background:var(--bg3);border:2px solid var(--border);border-radius:var(--r);padding:14px 10px;text-align:center;cursor:pointer;transition:all .15s;font-family:inherit}
.worker-btn:hover{border-color:var(--blue)}
.worker-btn.selected{border-color:var(--blue);background:rgba(77,156,248,.1)}
.worker-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-bottom:6px}
.worker-name{font-size:13px;font-weight:600;color:var(--text)}
.pin-input{width:100%;background:var(--bg3);border:2px solid var(--border2);border-radius:var(--rs);padding:14px;color:var(--text);font-size:24px;font-weight:700;text-align:center;letter-spacing:8px;outline:none;font-family:monospace}
.pin-input:focus{border-color:var(--blue)}

/* FORM */
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--rs);padding:13px 14px;color:var(--text);font-size:16px;outline:none;font-family:inherit;-webkit-appearance:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue)}
.field textarea{resize:vertical;min-height:70px}

/* DROP / FILE */
.filebox{border:2px dashed var(--border2);border-radius:var(--r);padding:22px 16px;text-align:center;background:var(--bg3);cursor:pointer;transition:all .15s}
.filebox:hover{border-color:var(--blue)}
.filebox .big{font-size:32px;margin-bottom:6px}
.filebox .t{font-size:14px;font-weight:600}
.filebox .s{font-size:12px;color:var(--text3);margin-top:4px}
.file-hidden{display:none}

/* PREVIEW */
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pv{position:relative;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);overflow:hidden;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.pv img{width:100%;height:100%;object-fit:cover}
.pv .pdf{font-size:12px;color:var(--text2);text-align:center;padding:8px;word-break:break-word}
.pv .rm{position:absolute;top:4px;right:4px;background:rgba(240,82,82,.9);border:none;color:#fff;width:22px;height:22px;border-radius:50%;font-size:14px;line-height:1;cursor:pointer}

/* BOTONES */
.btn{width:100%;background:var(--blue);border:none;border-radius:var(--r);padding:15px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.green{background:var(--green)}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* MENSAJES */
.msg{border-radius:var(--rs);padding:12px 14px;font-size:14px;margin-top:14px;display:none}
.msg.show{display:block}
.msg.ok{background:rgba(34,196,135,.12);border:1px solid var(--green);color:var(--green)}
.msg.warn{background:rgba(245,158,11,.12);border:1px solid var(--amber);color:var(--amber)}
.msg.error{background:rgba(240,82,82,.12);border:1px solid var(--red);color:var(--red)}
.hint{font-size:12px;color:var(--text3);margin-top:6px}
.done-card{background:var(--bg2);border:1px solid var(--green);border-radius:16px;padding:26px 22px;text-align:center;margin-top:24px}
.done-card .big{font-size:40px;margin-bottom:10px}
.done-card .t{font-size:16px;font-weight:600;margin-bottom:6px}
.done-card .s{font-size:13px;color:var(--text3);margin-bottom:20px}
</style>
</head>
<body>
<script>try{if(localStorage.getItem("cp_theme")==="light")document.body.classList.add("light");}catch(e){}</script>

<div class="header">
  <div class="logo">CP</div>
  <div>
    <div class="header-text">Subir factura</div>
    <div class="header-sub" id="header-sub"></div>
  </div>
  <button class="header-logout" id="logout-btn" onclick="logout()" style="display:none">Salir</button>
</div>

<!-- LOGIN -->
<div class="page" id="page-login">
  <div class="container">
    <div class="login-card">
      <div class="login-title">Acceso oficina</div>
      <div class="login-sub">Elige tu nombre e introduce el PIN</div>
      <div class="worker-grid" id="worker-selector"></div>
      <input type="tel" inputmode="numeric" id="pin-input" class="pin-input" placeholder="••••" maxlength="6" onkeydown="if(event.key==='Enter')doLogin()">
      <div style="height:16px"></div>
      <button class="btn" id="login-btn" onclick="doLogin()">Entrar →</button>
      <div class="msg" id="login-msg"></div>
    </div>
  </div>
</div>

<!-- FORM -->
<div class="page" id="page-form">
  <div class="container">
    <div class="field">
      <label>Factura (foto o PDF)</label>
      <div class="filebox" id="filebox" onclick="document.getElementById('file-input').click()">
        <div class="big">📎</div>
        <div class="t">Hacer foto o elegir archivo</div>
        <div class="s">Fotos o PDF · puedes añadir varios</div>
      </div>
      <input type="file" id="file-input" class="file-hidden" accept="image/*,application/pdf" capture="environment" multiple onchange="onFiles(this.files)">
      <div class="preview" id="preview"></div>
    </div>

    <div class="field">
      <label>Obra</label>
      <select id="obra-select" onchange="onObraChange()">
        <option value="">— Elige la obra —</option>
      </select>
      <div id="obra-nueva" style="display:none;margin-top:8px">
        <input type="text" id="obra-ref" placeholder="Referencia (ej. Calle Comerç 76 - Fachada)" style="margin-bottom:8px">
        <input type="text" id="obra-cliente" placeholder="Cliente (busca en StelOrder)" autocomplete="off">
      </div>
      <div class="hint">La factura se etiqueta por obra para la rentabilidad real. Para una obra nueva, elige el cliente del buscador de StelOrder.</div>
    </div>

    <div class="field">
      <label>Nota (opcional)</label>
      <textarea id="nota" placeholder="Proveedor, nº de factura, lo que quieras…"></textarea>
    </div>

    <button class="btn" id="send-btn" onclick="enviar()">📤 Subir a StelOrder</button>
    <div class="msg" id="form-msg"></div>
  </div>
</div>

<!-- DONE -->
<div class="page" id="page-done">
  <div class="container">
    <div class="done-card">
      <div class="big">✅</div>
      <div class="t" id="done-title">Recibida</div>
      <div class="s" id="done-sub"></div>
      <button class="btn green" onclick="nuevaFactura()">Subir otra factura</button>
    </div>
  </div>
</div>

<script src="/cliente-autocomplete.js"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}

let workerToken = null, workerInfo = null, esAdmin = false;
let todosWorkers = [];
let archivos = []; // {file, isPdf, url}
let clientesStel = [];
const normTxt = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function clienteStelValido(txt){ const n=normTxt(txt); return clientesStel.find(c=>normTxt(c)===n)||null; }

const WORKER_COLORS = {};

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
}
function showMsg(id,text,type){
  const m=document.getElementById(id);
  m.textContent=text; m.className='msg show '+(type||'ok');
}
function hideMsg(id){ const m=document.getElementById(id); m.className='msg'; }

// ── LOGIN (mismo mecanismo y sesión que parte.html) ──────────────────────────
async function loadWorkers(){
  try{
    const r=await fetch('/api/partes/workers');
    todosWorkers=await r.json();
    const c=document.getElementById('worker-selector');
    c.innerHTML=todosWorkers.map(w=>`
      <button class="worker-btn" data-id="${w.id}" onclick="selectWorker(this)">
        <div class="worker-dot" style="background:${WORKER_COLORS[w.id]||'#888'}"></div>
        <div class="worker-name">${w.name.split(' ')[0]}</div>
        <div style="font-size:11px;color:var(--text3)">${w.name.split(' ').slice(1).join(' ')}</div>
      </button>`).join('');
  }catch(e){
    document.getElementById('worker-selector').innerHTML='<div style="color:var(--text3);font-size:13px">Error cargando usuarios</div>';
  }
}
function selectWorker(btn){
  document.querySelectorAll('.worker-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('pin-input').focus();
}
function bloqueoTecnico(){document.body.innerHTML='<div style="max-width:440px;margin:80px auto;text-align:center;padding:24px;color:var(--text)"><div style="font-size:44px">🔒</div><h2 style="margin:12px 0 6px">Solo para oficina</h2><p style="color:var(--text2);line-height:1.6">Los técnicos no subís facturas. Usa el <a href="/parte" style="color:var(--blue)">parte de trabajo</a>.</p></div>';}
async function enterApp(token, info, persist){
  if((info.role||'')==='tech'){bloqueoTecnico();return;}
  workerToken=token; workerInfo=info; esAdmin=!!info.admin;
  if(persist){
    localStorage.setItem('cpWT',token);
    localStorage.setItem('cpWN',info.workerName||'');
    localStorage.setItem('cpWI',String(info.workerId||''));
  }
  document.getElementById('header-sub').textContent=info.workerName||'';
  const lb=document.getElementById('logout-btn'); lb.textContent=esAdmin?'← Dashboard':'Salir'; lb.style.display='block';
  showPage('form');
  await cargarObras();
  try{ const r=await fetch('/api/clients/list',{headers:{'Authorization':`Bearer ${workerToken}`}}); clientesStel = r.ok ? await r.json() : []; }catch(e){ clientesStel=[]; }
}
// SSO: entra sin PIN si hay sesión de admin del dashboard (cp_token) o de trabajador (cpWT).
async function tryRestoreSession(){
  const admin=localStorage.getItem('cp_token');
  const worker=localStorage.getItem('cpWT');
  for(const [t,isAdmin] of [[admin,true],[worker,false]]){
    if(!t) continue;
    try{
      const r=await fetch('/api/oficina/whoami',{headers:{'Authorization':`Bearer ${t}`}});
      if(!r.ok) continue;
      const d=await r.json();
      await enterApp(t,{workerName:d.name, admin:d.admin, role:d.role}, !isAdmin);
      return true;
    }catch(e){}
  }
  localStorage.removeItem('cpWT');localStorage.removeItem('cpWN');localStorage.removeItem('cpWI');
  return false;
}
async function doLogin(){
  const sel=document.querySelector('.worker-btn.selected');
  if(!sel){ showMsg('login-msg','⚠️ Selecciona tu nombre','warn'); return; }
  const workerId=sel.dataset.id;
  const pin=document.getElementById('pin-input').value;
  if(pin.length<4){ showMsg('login-msg','⚠️ Introduce el PIN','warn'); return; }
  const btn=document.getElementById('login-btn');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Verificando…';
  try{
    const r=await fetch('/api/partes/worker-login',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({workerId,pin})
    });
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||'PIN incorrecto');
    hideMsg('login-msg');
    await enterApp(data.token,{workerId:data.workerId, workerName:data.workerName, role:data.role}, true);
  }catch(err){
    showMsg('login-msg','❌ '+err.message,'error');
    document.getElementById('pin-input').value='';
  }finally{
    btn.disabled=false; btn.innerHTML='Entrar →';
  }
}
function logout(){
  if(esAdmin){ location.href='/'; return; } // SSO admin: volver al dashboard
  workerToken=null; workerInfo=null;
  localStorage.removeItem('cpWT');localStorage.removeItem('cpWN');localStorage.removeItem('cpWI');
  document.getElementById('pin-input').value='';
  document.getElementById('logout-btn').style.display='none';
  document.querySelectorAll('.worker-btn').forEach(b=>b.classList.remove('selected'));
  showPage('login');
}

// ── OBRAS ────────────────────────────────────────────────────────────────────
async function cargarObras(){
  try{
    const r=await fetch('/api/facturas/obras',{headers:{'Authorization':`Bearer ${workerToken}`}});
    if(!r.ok) throw new Error('no autorizado');
    const lista=await r.json();
    const sel=document.getElementById('obra-select');
    const opts=lista.map(o=>{
      const label=[o.reference,o.clientName].filter(Boolean).join(' — ')||'(sin nombre)';
      return `<option value="${o.id}" data-ref="${label.replace(/"/g,'&quot;')}">${label}</option>`;
    }).join('');
    sel.innerHTML='<option value="">— Elige la obra —</option>'+opts+'<option value="__nueva__">➕ Nueva obra…</option>';
  }catch(e){
    const sel=document.getElementById('obra-select');
    sel.innerHTML='<option value="">— Elige la obra —</option><option value="__nueva__">➕ Nueva obra…</option>';
  }
  // Autocompletado de cliente de StelOrder para la obra nueva.
  if(window.initClienteAutocomplete) initClienteAutocomplete(document.getElementById('obra-cliente'), workerToken);
}
function onObraChange(){
  const sel=document.getElementById('obra-select');
  const nueva=document.getElementById('obra-nueva');
  const es = sel.value==='__nueva__';
  nueva.style.display = es ? 'block' : 'none';
  if(es) document.getElementById('obra-ref').focus();
}
function obraActual(){
  const sel=document.getElementById('obra-select');
  if(sel.value==='__nueva__'){
    const ref=document.getElementById('obra-ref').value.trim();
    const cli=document.getElementById('obra-cliente').value.trim();
    const obraRef=[ref,cli].filter(Boolean).join(' — ');
    return { obraId:'', obraRef, nueva:{ref,cli} };
  }
  if(sel.value){
    const opt=sel.options[sel.selectedIndex];
    return { obraId:sel.value, obraRef:opt.getAttribute('data-ref')||'' };
  }
  return { obraId:'', obraRef:'' };
}

// ── ARCHIVOS + PREVIEW + COMPRESIÓN ──────────────────────────────────────────
async function onFiles(fileList){
  for(const f of Array.from(fileList||[])){
    const isPdf = /pdf/i.test(f.type) || /\.pdf$/i.test(f.name);
    let file = f;
    if(!isPdf && /^image\//i.test(f.type)){
      try{ file = await comprimirImagen(f); }catch(e){ file = f; }
    }
    const url = isPdf ? null : URL.createObjectURL(file);
    archivos.push({ file, isPdf, url });
  }
  document.getElementById('file-input').value='';
  renderPreview();
}
function renderPreview(){
  const c=document.getElementById('preview');
  c.innerHTML=archivos.map((a,i)=>`
    <div class="pv">
      ${a.isPdf ? `<div class="pdf">📄 ${a.file.name||'PDF'}</div>` : `<img src="${a.url}" alt="">`}
      <button class="rm" onclick="quitar(${i})">×</button>
    </div>`).join('');
}
function quitar(i){
  const a=archivos[i];
  if(a && a.url) URL.revokeObjectURL(a.url);
  archivos.splice(i,1);
  renderPreview();
}
// Reduce el peso de fotos grandes (máx 2000px, JPEG 0.8). Los PDF NO se tocan.
function comprimirImagen(file){
  return new Promise((resolve,reject)=>{
    if(file.size <= 1.2*1024*1024) return resolve(file); // ya es pequeña
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const max=2000;
      let {width,height}=img;
      if(width>max||height>max){
        const r=Math.min(max/width,max/height);
        width=Math.round(width*r); height=Math.round(height*r);
      }
      const canvas=document.createElement('canvas');
      canvas.width=width; canvas.height=height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      canvas.toBlob(blob=>{
        if(!blob) return resolve(file);
        const name=(file.name||'foto').replace(/\.(png|heic|heif|webp)$/i,'.jpg');
        resolve(new File([blob], name.endsWith('.jpg')?name:name+'.jpg', {type:'image/jpeg'}));
      },'image/jpeg',0.8);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src=url;
  });
}

// ── ENVÍO ────────────────────────────────────────────────────────────────────
async function enviar(){
  hideMsg('form-msg');
  if(!archivos.length){ showMsg('form-msg','⚠️ Añade al menos una foto o PDF','warn'); return; }
  const obra=obraActual();
  const esNueva=document.getElementById('obra-select').value==='__nueva__';
  let cliOk=null;
  if(esNueva){
    if(!obra.nueva || !obra.nueva.ref || !obra.nueva.cli){ showMsg('form-msg','⚠️ Para la obra nueva: referencia y cliente (de StelOrder)','warn'); return; }
    cliOk=clienteStelValido(obra.nueva.cli);
    if(!cliOk){ showMsg('form-msg','⚠️ Elige el cliente de la lista de StelOrder (no coincide con ninguno)','warn'); return; }
    obra.nueva.cli=cliOk; obra.obraRef=[obra.nueva.ref,cliOk].filter(Boolean).join(' — ');
  }
  if(!obra.obraRef){ showMsg('form-msg','⚠️ Elige la obra','warn'); return; }

  const btn=document.getElementById('send-btn');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Subiendo…';

  try{
    // Si es obra nueva, la creamos (queda como obra real para la rentabilidad).
    if(esNueva){
      try{
        const rn=await fetch('/api/facturas/obra-nueva',{method:'POST',headers:{'Authorization':`Bearer ${workerToken}`,'Content-Type':'application/json'},body:JSON.stringify({reference:obra.nueva.ref,clientName:obra.nueva.cli})});
        const dn=await rn.json().catch(()=>({}));
        if(rn.ok && dn.id){ obra.obraId=dn.id; obra.obraRef=[dn.reference,dn.clientName].filter(Boolean).join(' — '); }
      }catch(e){ /* si falla la creación, seguimos con el texto de la obra */ }
    }
    const fd=new FormData();
    archivos.forEach((a,i)=>{
      const fname=a.file.name||(a.isPdf?`factura-${i+1}.pdf`:`factura-${i+1}.jpg`);
      fd.append('files', a.file, fname);
    });
    fd.append('obraId', obra.obraId);
    fd.append('obraRef', obra.obraRef);
    fd.append('nota', document.getElementById('nota').value.trim());

    const r=await fetch('/api/facturas/subir',{
      method:'POST',
      headers:{'Authorization':`Bearer ${workerToken}`},
      body:fd
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok || !data.ok) throw new Error(data.reply || data.error || 'No se pudo subir');

    document.getElementById('done-title').textContent='Recibida';
    document.getElementById('done-sub').textContent = data.reply || `Obra: ${obra.obraRef}. La subo a StelOrder.`;
    showPage('done');
  }catch(err){
    showMsg('form-msg','❌ '+err.message,'error');
  }finally{
    btn.disabled=false; btn.innerHTML='📤 Subir a StelOrder';
  }
}
function nuevaFactura(){
  archivos.forEach(a=>{ if(a.url) URL.revokeObjectURL(a.url); });
  archivos=[];
  renderPreview();
  document.getElementById('obra-select').value='';
  document.getElementById('obra-ref').value='';
  document.getElementById('obra-cliente').value='';
  document.getElementById('obra-nueva').style.display='none';
  document.getElementById('nota').value='';
  hideMsg('form-msg');
  showPage('form');
}

// ── ARRANQUE ─────────────────────────────────────────────────────────────────
(async function init(){
  await loadWorkers();
  const ok=await tryRestoreSession();
  if(!ok) showPage('login');
})();
</script>
</body>
</html>
