<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa GPS — Corp Projects</title>
<link rel="stylesheet" href="/tool-theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<meta name="theme-color" content="#4d9cf8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0c0e12;--bg2:#13161c;--bg3:#1a1e27;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.15);
  --text:#f0f2f7;--text2:#8b92a8;--text3:#5a6278;--green:#22c487;--red:#f05252;--blue:#4d9cf8;--amber:#f59e0b;--rs:10px;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;min-height:100vh}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:1000}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#4d9cf8,#22c487);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.header-text{font-weight:600;font-size:15px}.header-sub{font-size:12px;color:var(--text3)}
.header-logout{margin-left:auto;background:none;border:1px solid var(--border2);border-radius:8px;color:var(--text3);padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:none}
.container{padding:16px;max-width:960px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.bar input,.bar select{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);padding:9px 12px;font-size:14px;font-family:inherit}
.bar button{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);width:40px;height:40px;font-size:18px;cursor:pointer;font-family:inherit}
#map{height:62vh;min-height:360px;border-radius:14px;border:1px solid var(--border);overflow:hidden}
.leaflet-container{background:#1a1e27}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--text2)}
.legend .it{display:flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff}
.note{font-size:11px;color:var(--text3);margin-top:10px;line-height:1.5}
.empty{text-align:center;padding:30px;color:var(--text3)}
.count{font-size:13px;color:var(--text2);margin-left:auto}
.pop b{color:#111}.pop{color:#333;font-size:13px;line-height:1.4}
</style>
</head>
<body>
<div class="header">
  <div class="logo">CP</div>
  <div><div class="header-text">Mapa GPS</div><div class="header-sub">Sellos de partes y fichajes</div></div>
  <a class="header-logout" href="/">← Panel</a>
</div>
<div class="container">
  <div class="bar">
    <button onclick="mueveDia(-1)" title="Día anterior">‹</button>
    <input type="date" id="fecha" onchange="cargar()">
    <button onclick="mueveDia(1)" title="Día siguiente">›</button>
    <button onclick="hoy()" title="Hoy" style="width:auto;padding:0 12px;font-size:14px">Hoy</button>
    <select id="worker" onchange="dibujar()"><option value="">Todos</option></select>
    <span class="count" id="count"></span>
  </div>
  <div id="map"></div>
  <div class="legend">
    <div class="it"><span class="dot" style="background:var(--green)"></span> Fichó entrada</div>
    <div class="it"><span class="dot" style="background:var(--red)"></span> Fichó salida</div>
    <div class="it"><span class="dot" style="background:var(--blue)"></span> Parte de trabajo</div>
  </div>
  <div class="note">📍 Puntos donde el operario fichó o envió un parte, con su hora. No es un rastreo continuo: son sellos en momentos concretos, registrados durante la jornada y con su consentimiento.</div>
  <div class="empty" id="empty" style="display:none">Sin puntos GPS ese día.</div>
</div>
<script>
const tok=localStorage.getItem('cp_token');
if(!tok){ location.href='/'; }
let map, capa, datos={puntos:[],workers:[]};
const COLOR={entrada:'#22c487',salida:'#f05252',parte:'#4d9cf8'};
const TIPO={entrada:'Fichó entrada',salida:'Fichó salida',parte:'Parte de trabajo'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function horaTxt(x){ if(!x) return ''; try{ return new Date(x).toLocaleString('es-ES',{timeZone:'Europe/Madrid',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function hoy(){ document.getElementById('fecha').value=new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Madrid'}); cargar(); }
function mueveDia(n){ const f=document.getElementById('fecha'); const d=new Date(f.value||new Date()); d.setDate(d.getDate()+n); f.value=d.toISOString().slice(0,10); cargar(); }
function initMap(){ map=L.map('map',{zoomControl:true}).setView([41.98,2.82],13); // Girona por defecto
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map); }
async function cargar(){
  const fecha=document.getElementById('fecha').value;
  try{
    const r=await fetch('/api/gps/dia?fecha='+encodeURIComponent(fecha),{headers:{'Authorization':`Bearer ${tok}`}});
    if(r.status===401||r.status===403){ location.href='/'; return; }
    datos=await r.json();
  }catch(e){ datos={puntos:[],workers:[]}; }
  // relleno selector de trabajadores
  const sel=document.getElementById('worker'); const prev=sel.value;
  sel.innerHTML='<option value="">Todos</option>'+(datos.workers||[]).map(w=>`<option value="${esc(w.id)}">${esc(w.name||w.id)}</option>`).join('');
  if([...sel.options].some(o=>o.value===prev)) sel.value=prev;
  dibujar();
}
function dibujar(){
  if(capa){ map.removeLayer(capa); capa=null; }
  const wf=document.getElementById('worker').value;
  const pts=(datos.puntos||[]).filter(p=>!wf||String(p.quienId)===wf);
  document.getElementById('count').textContent=pts.length?`${pts.length} punto(s)`:'';
  document.getElementById('empty').style.display=pts.length?'none':'block';
  capa=L.layerGroup();
  const bounds=[];
  pts.forEach(p=>{
    if(!Number.isFinite(p.lat)||!Number.isFinite(p.lng)) return;
    const m=L.circleMarker([p.lat,p.lng],{radius:9,color:'#fff',weight:2,fillColor:COLOR[p.tipo]||'#888',fillOpacity:.95});
    m.bindPopup(`<div class="pop"><b>${esc(p.quien||'')}</b><br>${esc(TIPO[p.tipo]||p.tipo)}<br>${esc(horaTxt(p.hora))}${p.etiqueta?'<br>'+esc(p.etiqueta):''}${p.acc?'<br><span style="color:#888">±'+Math.round(p.acc)+' m</span>':''}</div>`);
    m.addTo(capa); bounds.push([p.lat,p.lng]);
  });
  capa.addTo(map);
  if(bounds.length===1) map.setView(bounds[0],16);
  else if(bounds.length>1) map.fitBounds(bounds,{padding:[40,40]});
}
initMap();
hoy();
</script>
</body>
</html>
